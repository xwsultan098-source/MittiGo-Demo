<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Uslub: "Online Groceries" (Nectar) Figma shabloni asosida — oq fon, chegarali kartochkalar,
   18px radius, kvadrat "+" tugma, pastel kategoriya plitkalari. Ranglar — Mitti Go logotipidan. */
:root{
  --brand:#d82c90;          /* Mitti Go pushti — asosiy rang (shablondagi yashil o'rnida) */
  --brand-2:#00acee;        /* Mitti Go havorang */
  --navy:#293897;           /* Mitti Go to'q ko'k */
  --on-brand:#fff;
  --sale:#f3603f;
  --ok:#53b175; --amber:#f8a44c; --red:#e5484d;
  --bg:var(--tg-theme-bg-color,#fff);
  --card:var(--tg-theme-bg-color,#fff);
  --text:var(--tg-theme-text-color,#181725);
  --hint:var(--tg-theme-hint-color,#7c7c7c);
  --fill:color-mix(in srgb,var(--text) 5%,var(--bg));      /* shablondagi #F2F3F2 */
  --line:color-mix(in srgb,var(--text) 11%,var(--bg));     /* shablondagi #E2E2E2 */
  --brand-soft:color-mix(in srgb,var(--brand) 11%,var(--bg));
  --r:18px; --rb:17px; --rbig:19px;
  --imgbg:color-mix(in srgb,var(--text) 4%,var(--bg));
  --font:"Outfit","Gilroy",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not(.tg):not([data-theme="light"]){--bg:#13181f;--card:#13181f;--text:#f1f3f6;--hint:#8a95a3;color-scheme:dark}
}
/* Qo'lda tanlangan mavzu (quyosh/oy tugmasi) Telegram mavzusidan ustun turadi */
:root[data-theme="dark"]{--bg:#13181f;--card:#13181f;--text:#f1f3f6;--hint:#8a95a3;color-scheme:dark}
:root[data-theme="light"]{--bg:#ffffff;--card:#ffffff;--text:#181725;--hint:#7c7c7c;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font:15px/1.35 var(--font);-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(100px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
img{display:block;max-width:100%}
.hide{display:none!important}
.muted{color:var(--hint)}
.small{font-size:13px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ── bosh sahifa tepasi ── */
.top{position:relative;background:var(--bg);padding:14px 20px 4px;text-align:center}
/* ── quyosh/oy tugmasi ── */
.themebtn{position:absolute;right:16px;top:14px;width:44px;height:44px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--text);overflow:hidden;transition:background .3s,transform .15s}
.themebtn:active{transform:scale(.88)}
.themebtn svg{width:24px;height:24px;overflow:visible}
.themebtn .core{transition:r .5s cubic-bezier(.4,0,.2,1),fill .4s;fill:#f8b733}
.themebtn .bite{transition:cx .5s cubic-bezier(.4,0,.2,1),cy .5s cubic-bezier(.4,0,.2,1)}
.themebtn .rays{transform-origin:12px 12px;transition:transform .55s cubic-bezier(.4,0,.2,1),opacity .35s;stroke:#f8b733}
.themebtn .stars{opacity:0;transition:opacity .3s}
.themebtn .stars circle{fill:#ffe9a6;transform-box:fill-box;transform-origin:center}
.themebtn.night .core{r:9px;fill:#ffd96a}
.themebtn.night .bite{cx:17px;cy:7px}
.themebtn.night .rays{transform:rotate(90deg) scale(.4);opacity:0}
.themebtn.night .stars{opacity:1;transition-delay:.25s}
.themebtn.night .stars circle{animation:tw 2.4s ease-in-out infinite}
.themebtn.night .stars circle:nth-child(2){animation-delay:.8s}
.themebtn.night .stars circle:nth-child(3){animation-delay:1.6s}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}
.themebtn.spin svg{animation:spin .6s cubic-bezier(.4,0,.2,1)}
@keyframes spin{from{transform:rotate(-120deg) scale(.6)}to{transform:none}}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){z-index:2}
.logo{display:inline-block;height:42px;width:auto}
.loc{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px;font-weight:600;font-size:15px;color:color-mix(in srgb,var(--text) 80%,var(--bg))}
.loc b{color:var(--brand)}
.search{display:flex;align-items:center;gap:10px;background:var(--fill);border-radius:15px;padding:0 16px;height:52px;margin:18px 0 0;text-align:left}
.search svg{flex:none}
.search input{flex:1;border:0;outline:0;background:none;height:100%;min-width:0;font-size:15px;font-weight:500}
.search input::placeholder{color:var(--hint)}
.search .x{color:var(--hint);font-size:22px;line-height:1;padding:4px}

/* ── banner ── */
.banner{position:relative;display:flex;align-items:center;min-height:115px;border-radius:var(--r);overflow:hidden;margin:20px 0 4px;background:linear-gradient(100deg,color-mix(in srgb,var(--brand) 12%,var(--bg)),color-mix(in srgb,var(--brand-2) 14%,var(--bg)));width:100%;text-align:left}
.banner .bi{width:42%;align-self:stretch;display:flex;align-items:center;justify-content:center;padding:10px}
.banner .bi img{max-height:96px;object-fit:contain;filter:drop-shadow(0 8px 12px rgba(0,0,0,.12))}
.banner .bi .ini{font-size:44px;font-weight:700;color:var(--brand)}
.banner .bt{flex:1;padding:14px 18px 14px 0;text-align:right}
.banner h3{font-size:21px;font-weight:700;line-height:1.15;color:var(--text)}
.banner p{color:var(--brand);font-weight:600;font-size:14px;margin-top:4px}

/* ── banner karuseli ── */
.btrack{display:flex;gap:12px;overflow-x:auto;margin:20px -20px 0;padding:0 20px;scroll-snap-type:x mandatory;scroll-padding:0 20px;scrollbar-width:none}
.btrack::-webkit-scrollbar{display:none}
.btrack .banner{flex:0 0 100%;margin:0;scroll-snap-align:start;min-height:128px}
/* Admin yuklagan banner: 1200×600 (2:1) */
.banner.bimg{padding:0;aspect-ratio:2/1;min-height:0;background:var(--imgbg)}
.banner.bimg img{width:100%;height:100%;object-fit:cover;display:block}
.banner .bi .ph{width:100%;max-width:120px;margin:0;border-radius:14px;background:rgba(255,255,255,.6);box-shadow:0 6px 16px rgba(0,0,0,.1)}
.banner .deco{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);pointer-events:none}
.banner h3{white-space:pre-line}
.banner .bt{position:relative;z-index:1}
.banner .bi{position:relative;z-index:1}
.banner .soon{display:inline-block;margin-top:8px;background:var(--navy);color:#fff;font-size:11px;font-weight:700;letter-spacing:.4px;padding:3px 9px;border-radius:999px}
.banner .em{font-size:64px;line-height:1;filter:drop-shadow(0 8px 10px rgba(0,0,0,.15))}
.dots{display:flex;justify-content:center;gap:5px;margin-top:10px}
.dots i{width:5px;height:5px;border-radius:3px;background:var(--line);transition:width .25s,background .25s}
.dots i.on{width:16px;background:var(--brand)}
/* ── bo'lim sarlavhalari ── */
.view{display:none;padding:0 20px 20px}
.view.on{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sec{display:flex;align-items:center;justify-content:space-between;margin:28px 0 16px}
.sec h2{font-size:22px;font-weight:600;letter-spacing:.1px}
.sec button,.sec span{color:var(--brand);font-weight:600;font-size:15px}
.ptitle{position:relative;font-size:20px;font-weight:700;text-align:center;padding:18px 44px 16px}
.ptitle .bk{position:absolute;left:-8px;top:50%;transform:translateY(-50%);width:40px;height:40px;display:grid;place-items:center}
.hr{height:1px;background:var(--line);margin:0 -20px}

/* ── mahsulot kartochkasi (shablon: 173×249, 18px, #E2E2E2) ── */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.rail{display:flex;gap:15px;overflow-x:auto;margin:0 -20px;padding:0 20px 4px;scroll-snap-type:x mandatory;scroll-padding:0 20px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .card{flex:0 0 calc((100vw - 62px) / 2);max-width:200px;scroll-snap-align:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;position:relative;padding:6px 6px 12px;min-width:0}
.card .nm,.card .sub,.card .pr{padding-left:8px;padding-right:8px}
/* Rasm katagi: kvadrat (1:1). Kvadrat rasm to'liq to'ldiradi, boshqa o'lchamdagisi butunligicha och fonda */
.ph{position:relative;aspect-ratio:1/1;width:100%;max-width:100%;border-radius:14px;overflow:hidden;background:var(--imgbg);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.ph img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.ph.fit img{object-fit:contain;padding:7%}
.ph img.ld{opacity:1}
.vdots{position:absolute;right:8px;bottom:8px;display:flex;gap:3px;background:rgba(255,255,255,.85);padding:4px 6px;border-radius:999px}
.vdots i{width:7px;height:7px;border-radius:50%;background:var(--brand)}
.vdots i:nth-child(2){background:var(--brand-2)}.vdots i:nth-child(3){background:#f8a44c}.vdots i:nth-child(4){background:#53b175}
.plus{position:relative}
.pq{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--navy);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid var(--card)}
.ini{width:84px;height:84px;border-radius:24px;display:grid;place-items:center;font-size:34px;font-weight:700;color:var(--brand);background:var(--brand-soft)}
.badge{position:absolute;top:8px;left:8px;background:var(--sale);color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;z-index:1}
.nm{font-size:16px;font-weight:700;line-height:1.15;letter-spacing:.1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.3em}
.sub{color:var(--hint);font-size:14px;font-weight:500;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub.low{color:var(--sale)}
.pr{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;margin-top:auto;padding-top:16px;flex-wrap:wrap}
.price{display:flex;flex-direction:column;min-width:0}
.price b{font-size:17px;font-weight:600;letter-spacing:.1px;white-space:nowrap}
.price b small{font-size:12px;font-weight:600}
.price b.s{color:var(--sale)}
.price s{color:var(--hint);font-size:12.5px;font-weight:500}
.plus{width:42px;height:42px;flex:none;border-radius:var(--rb);background:var(--brand);color:var(--on-brand);display:grid;place-items:center;transition:transform .1s}
.plus:active{transform:scale(.92)}
.ctl:has(.step){flex-basis:100%}
.step{display:flex;align-items:center;justify-content:space-between;gap:6px}
.step button{width:40px;height:40px;border-radius:15px;border:1px solid var(--line);display:grid;place-items:center;color:var(--hint)}
.step button.inc{color:var(--brand)}
.step button:disabled{opacity:.35}
.step b{font-size:17px;font-weight:600;min-width:22px;text-align:center}

/* ── kategoriya plitkalari (shablon: Explore va Groceries) ── */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.tile{border-radius:var(--r);border:1px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px 12px;min-height:190px;text-align:center}
.tile .ti{width:100px;height:100px;border-radius:20px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.6)}
.tile .ti img{width:100%;height:100%;object-fit:cover}
.tile .ti.fit img,.ctile .ti.fit img{object-fit:contain}
.tile .ti .ini{width:72px;height:72px;font-size:30px;background:rgba(255,255,255,.55)}
.tile b{font-size:16px;font-weight:700;line-height:1.25;color:var(--text)}
.tile small{display:block;color:var(--hint);font-size:13px;font-weight:500;margin-top:3px}
.crail{display:flex;gap:15px;overflow-x:auto;margin:0 -20px;padding:0 20px 4px;scrollbar-width:none}
.crail::-webkit-scrollbar{display:none}
.ctile{flex:0 0 auto;width:240px;height:105px;border-radius:var(--r);display:flex;align-items:center;gap:14px;padding:0 18px;text-align:left}
.ctile .ti{width:76px;height:76px;flex:none;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.6)}
.ctile .ti img{width:100%;height:100%;object-fit:cover}
.ctile .ti .ini{width:64px;height:64px;font-size:26px;background:rgba(255,255,255,.55)}
.ctile b{font-size:18px;font-weight:600;color:var(--text);line-height:1.2}
.subchips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 16px;padding:0 20px;scrollbar-width:none}
.subchips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap;color:color-mix(in srgb,var(--text) 80%,var(--bg))}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}

.empty{text-align:center;color:var(--hint);padding:56px 20px}
.empty .e{font-size:48px;margin-bottom:12px}
.empty p{margin-bottom:18px;font-size:16px}
.btn{height:56px;padding:0 24px;border-radius:var(--rbig);background:var(--brand);color:var(--on-brand);font-weight:600;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn.ghost{background:none;color:var(--text)}
.btn.soft{background:var(--fill);color:var(--text)}
.btn.block{width:100%}
.btn .tag{background:rgba(0,0,0,.14);border-radius:5px;padding:3px 6px;font-size:12px;font-weight:600}
.skel{background:linear-gradient(90deg,var(--fill) 25%,var(--line) 50%,var(--fill) 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--r)}
@keyframes sk{to{background-position:-200% 0}}

/* ── pastki menyu (shablon: oq, yuqori burchaklari yumaloq, soya) ── */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-radius:15px 15px 0 0;box-shadow:0 -10px 37px rgba(0,0,0,.07);display:flex;padding:10px 8px calc(10px + env(safe-area-inset-bottom))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--text);padding:4px 0;position:relative}
.nav button svg{width:25px;height:25px}
.nav button.on{color:var(--brand)}
.nb{position:absolute;top:-2px;left:calc(50% + 6px);background:var(--brand);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;padding:0 5px;display:none;align-items:center;justify-content:center;border:2px solid var(--card)}

/* ── savat (shablon: My Cart) ── */
.row{display:flex;gap:16px;align-items:center;padding:22px 0;border-bottom:1px solid var(--line);position:relative}
.row .ph{width:76px;height:76px;flex:none;margin:0;border-radius:14px}
.row .ph .ini{width:64px;height:64px;font-size:24px}
.row .badge{display:none}
.row .mid{flex:1;min-width:0;display:flex;flex-direction:column}
.row .nm{min-height:0;padding-right:28px;-webkit-line-clamp:2}
.row .rb{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.row .step{gap:14px}
.row .step button{width:44px;height:44px;border-radius:var(--rb)}
.row .rp{font-size:17px;font-weight:600;white-space:nowrap}
.row .rm{position:absolute;right:-4px;top:16px;width:32px;height:32px;display:grid;place-items:center;color:var(--hint)}
.sum>div{display:flex;justify-content:space-between;gap:10px;padding:16px 0;border-bottom:1px solid var(--line);font-size:16px}
.sum>div span:first-child{color:var(--hint);font-weight:500}
.sum>div b{font-weight:600}
.sum .t{border-bottom:0;font-size:19px}
.sum .t span:first-child{color:var(--text);font-weight:600}
.sum .t b{font-size:20px;font-weight:700}
.sum .g b{color:var(--ok)}
.note{display:flex;gap:10px;align-items:flex-start;padding:13px 15px;border-radius:15px;font-size:14px;line-height:1.4;margin:14px 0 0;background:var(--fill)}
.note.gift{background:color-mix(in srgb,var(--ok) 12%,var(--bg))}
.note.warn{background:color-mix(in srgb,var(--amber) 15%,var(--bg))}
.note.info{background:var(--brand-soft)}

/* ── rasmiylashtirish ── */
.blk{padding:20px 0;border-bottom:1px solid var(--line)}
.blk h3{font-size:18px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.seg{display:flex;background:var(--fill);border-radius:15px;padding:4px;margin-bottom:14px}
.seg button{flex:1;height:38px;border-radius:12px;font-size:14px;font-weight:600;color:var(--hint)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.mapwrap{position:relative;height:220px;border-radius:var(--r);overflow:hidden;background:var(--fill);margin-bottom:12px}
#map{position:absolute;inset:0}
.pin{position:absolute;left:50%;top:50%;z-index:500;transform:translate(-50%,-100%);pointer-events:none;transition:transform .15s}
.pin.up{transform:translate(-50%,-118%)}
.pin svg{filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.pinshadow{position:absolute;left:50%;top:50%;width:10px;height:4px;margin:-2px 0 0 -5px;border-radius:50%;background:rgba(0,0,0,.3);z-index:499;pointer-events:none}
.locbtn{position:absolute;right:10px;bottom:10px;z-index:600;height:40px;padding:0 14px;border-radius:14px;background:var(--card);font-weight:600;font-size:14px;box-shadow:0 2px 10px rgba(0,0,0,.18);display:flex;align-items:center;gap:6px}
.maphint{position:absolute;left:10px;top:10px;right:10px;z-index:600;text-align:center;pointer-events:none}
.maphint span{display:inline-block;background:rgba(24,23,37,.8);color:#fff;font-size:12.5px;padding:6px 12px;border-radius:999px}
.field{display:block;background:var(--fill);border-radius:15px;padding:10px 16px;margin-bottom:12px}
.field small{display:block;color:var(--hint);font-size:12.5px;font-weight:500;margin-bottom:2px}
.field input,.field textarea,.field select{width:100%;border:0;outline:0;background:none;resize:none;padding:2px 0;font-size:16px;font-weight:500}
.field select{appearance:none;-webkit-appearance:none}
.inl{display:flex;gap:10px;align-items:stretch}
.inl .field{flex:1;margin:0}
.inl .btn{height:auto;padding:0 14px;font-size:13px;border-radius:15px;line-height:1.2}
.pay{display:grid;gap:10px}
.pay button{display:flex;gap:14px;align-items:center;text-align:left;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line)}
.pay button.on{border:2px solid var(--brand);padding:13px 15px;background:var(--brand-soft)}
.pay button:disabled{opacity:.45}
.pay .ic{font-size:24px}
.pay b{display:block;font-size:16px;font-weight:600}
.pay small{color:var(--hint);font-size:13px;font-weight:500}
.err{color:var(--red);font-size:14px;padding-top:10px}

/* ── profil ── */
.phead{display:flex;align-items:center;gap:18px;padding:26px 0 18px}
.ava{width:64px;height:64px;border-radius:27px;object-fit:cover;flex:none;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:26px;font-weight:700}
.pmid{min-width:0}
.pname{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:700}
.pedit{color:var(--brand);width:30px;height:30px;display:grid;place-items:center;border-radius:10px;background:var(--brand-soft)}
.pstats{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-bottom:20px}
.pstats div{background:var(--fill);border-radius:15px;padding:12px 14px}
.pstats b{display:block;font-size:18px;font-weight:700}
.pstats span{color:var(--hint);font-size:13px;font-weight:500}
.prow{display:flex;align-items:center;gap:16px;width:100%;padding:19px 0;border-bottom:1px solid var(--line);text-align:left;font-size:17px;font-weight:600}
.prow .pic{width:24px;height:24px;flex:none;color:var(--text)}
.prow .pic svg{width:24px;height:24px}
.prow .pl{flex:1}
.prow .pr2{color:var(--hint);font-size:14px;font-weight:500}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:background .3s;flex:none}
.sw i{position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.sw.night{background:var(--brand)}
.sw.night i{transform:translateX(20px)}
.arow{display:flex;align-items:center;gap:14px;padding:18px 0;border-bottom:1px solid var(--line)}
.arow .mid{flex:1;min-width:0}
.arow b,.adr b{display:block;font-size:16px;font-weight:600}
.arow small,.adr small{display:block;color:var(--hint);font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai{width:44px;height:44px;flex:none;border-radius:15px;background:var(--fill);display:grid;place-items:center;font-size:21px}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--hint)}
.adrs{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-bottom:12px}
.adr{display:flex;align-items:center;gap:12px;min-width:0;overflow:hidden;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);text-align:left;width:100%}
.adr div{flex:1;min-width:0}
.adr .rad{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid var(--line);transition:border .2s}
.adr.on{border:2px solid var(--brand);padding:11px 13px;background:var(--brand-soft)}
.adr.on .rad{border:7px solid var(--brand)}
.tchips{display:flex;flex-wrap:wrap;gap:8px}
.lnkbtn{color:var(--brand);font-size:14px;font-weight:600}

/* ── buyurtmalar ── */
.ord{padding:20px 0;border-bottom:1px solid var(--line)}
.ord .oh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.ord .oh b{font-size:18px;font-weight:700}
.st{font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px}
.st.blue{background:var(--brand-soft);color:var(--brand)}
.st.green{background:color-mix(in srgb,var(--ok) 15%,var(--bg));color:var(--ok)}
.st.amber{background:color-mix(in srgb,var(--amber) 18%,var(--bg));color:#c56f12}
.st.red{background:color-mix(in srgb,var(--red) 13%,var(--bg));color:var(--red)}
.ord ul{list-style:none;font-size:14px;color:var(--hint);font-weight:500;margin-bottom:10px}
.ord li{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.ord li span:first-child{flex:1;min-width:0}
.ord li span:last-child{white-space:nowrap}
.ord .of{display:flex;justify-content:space-between;font-size:15px}
.ord .of b{font-weight:700}

/* ── buyurtma qabul qilindi (shablon: order accepted) ── */
.done{text-align:center;padding:40px 4px 10px;position:relative}
.done .ok{position:relative;width:200px;height:200px;margin:0 auto 46px}
.done .ok .c{position:absolute;inset:20px;border-radius:50%;background:var(--brand);display:grid;place-items:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.done .ok .c::after{content:"";position:absolute;inset:9px;border-radius:50%;border:2px solid rgba(255,255,255,.55)}
.done .ok i{position:absolute;border-radius:50%;animation:pop .6s .15s both}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.done h2{font-size:27px;font-weight:600;line-height:1.3;margin-bottom:14px}
.done p{color:var(--hint);font-size:16px;font-weight:500;line-height:1.5;margin:0 auto 24px;max-width:320px}
.cardnum{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--fill);border-radius:15px;padding:16px 18px;font-size:19px;font-weight:600;letter-spacing:1px;margin:0 0 16px}
.cardnum button{font-size:14px;font-weight:600;color:var(--brand);letter-spacing:0}

/* ── mahsulot sahifasi (shablon: Product Detail) ── */
.sbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.sbg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset:0;z-index:41;background:var(--card);overflow:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
/* Mahsulot sahifasi: kvadrat rasm maydoni, rasm to'liq sig'adi */
.sheet .hero{position:relative;background:var(--imgbg);border-radius:0 0 25px 25px;height:min(100vw,56vh,520px);overflow:hidden}
.sheet .hero .hi{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.sheet .hero .hi img{width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .25s}
.sheet .hero .hi img.ld{opacity:1}
.sheet .x{background:rgba(255,255,255,.85);color:#181725;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.opt{padding-top:20px}
.ol{font-size:14px;color:var(--hint);font-weight:500;margin-bottom:10px}
.ol b{color:var(--text);font-weight:600}
.vchips{display:flex;flex-wrap:wrap;gap:8px}
.vchip{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:14px;border:1px solid var(--line);font-size:14px;font-weight:600}
.vchip:not(:has(.vt)){padding-left:14px}
.vchip .vt{width:34px;height:34px;border-radius:10px;overflow:hidden;background:var(--imgbg);display:block}
.vchip .vt img{width:100%;height:100%;object-fit:cover;opacity:1}
.vchip.on{border:2px solid var(--brand);padding:5px 13px 5px 5px;background:var(--brand-soft)}
.vchip.on:not(:has(.vt)){padding-left:13px}
.vchip.dim{opacity:.45}
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.pk{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);text-align:left}
.pk b{font-size:15px;font-weight:600}
.pk span{font-size:15px;font-weight:700}
.pk small{font-size:12px;color:var(--hint);font-weight:500}
.pk small em{font-style:normal;color:var(--ok);font-weight:700}
.pk.on{border:2px solid var(--brand);padding:11px 13px;background:var(--brand-soft)}
.sheet .hero .ini{width:150px;height:150px;font-size:64px;border-radius:40px}
.sheet .hero .badge{top:auto;bottom:18px;left:20px;font-size:14px;padding:5px 10px}
.sheet .x{position:absolute;top:12px;left:12px;width:42px;height:42px;border-radius:21px;display:grid;place-items:center;z-index:3}
.sheet .in{padding:24px 24px 0}
.sheet .tt{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sheet h3{font-size:24px;font-weight:700;line-height:1.2;letter-spacing:.1px}
.sheet .sub{font-size:16px;font-weight:600;margin-top:8px}
.sheet .qrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:28px 0 26px;border-bottom:1px solid var(--line)}
.sheet .qty{display:flex;align-items:center;gap:16px}
.sheet .qty button{width:30px;height:46px;display:grid;place-items:center;color:var(--hint)}
.sheet .qty button.inc{color:var(--brand)}
.sheet .qty button:disabled{opacity:.3}
.sheet .qty b{width:46px;height:46px;border-radius:var(--rb);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;font-weight:600}
.sheet .bigp{text-align:right}
.sheet .bigp b{display:block;font-size:24px;font-weight:700;white-space:nowrap}
.sheet .bigp b.s{color:var(--sale)}
.sheet .bigp s{color:var(--hint);font-size:15px;font-weight:500}
.det{border-bottom:1px solid var(--line)}
.det summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:18px 0;font-size:16px;font-weight:600;cursor:pointer}
.det summary::-webkit-details-marker{display:none}
.det summary svg{transition:transform .2s}
.det[open] summary svg{transform:rotate(90deg)}
.det p{color:var(--hint);font-size:14px;font-weight:500;line-height:1.6;padding-bottom:16px;white-space:pre-line;animation:detIn .25s ease}
.det summary>span{display:flex;align-items:center;gap:10px}
.det .di{font-size:17px}
.det p.note-t{background:var(--brand-soft);color:var(--text);border-radius:14px;padding:12px 14px;margin-bottom:16px}
@keyframes detIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.drow{display:flex;align-items:center;justify-content:space-between;padding:18px 0;border-bottom:1px solid var(--line);font-size:16px;font-weight:600}
.drow span{background:var(--fill);border-radius:5px;padding:3px 8px;font-size:12px;color:var(--hint);font-weight:600}
.sheet .cta{padding:26px 0 6px}

<script>
"use strict";
/* ============ Telegram ============ */
const tg = window.Telegram && window.Telegram.WebApp;
const inTg = !!(tg && tg.initData);
const ver = v => { try { return tg.isVersionAtLeast(v); } catch(e){ return false; } };
if (tg) {
  tg.ready(); tg.expand();
  if (inTg) document.documentElement.classList.add("tg");
  try { if (ver("6.1")) { tg.setHeaderColor("bg_color"); tg.setBackgroundColor("bg_color"); } } catch(e){}
  try { if (ver("7.7")) tg.disableVerticalSwipes(); } catch(e){}
}

/* ============ mavzu: quyosh / oy ============ */
const THEME_KEY = "mg_theme";
function savedTheme(){ try { return localStorage.getItem(THEME_KEY); } catch(e){ return null; } }
function systemDark(){
  if (inTg && tg.colorScheme) return tg.colorScheme === "dark";
  return !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
}
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === "dark" : systemDark(); };
function syncTgColors(){
  if (!inTg) return;
  const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  try { if (ver("6.9") && /^#/.test(bg)) { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } } catch(e){}
  try { if (ver("7.10") && /^#/.test(bg)) tg.setBottomBarColor(bg); } catch(e){}
}
function applyTheme(t){
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  document.querySelectorAll('[data-a="theme"]').forEach(b => b.classList.toggle("night", isDark()));
  syncTgColors();
}
function toggleTheme(btn){
  const next = isDark() ? "light" : "dark";
  try { localStorage.setItem(THEME_KEY, next); } catch(e){}
  try { inTg && tg.HapticFeedback.impactOccurred("medium"); } catch(e){}
  btn.classList.remove("spin"); void btn.offsetWidth; btn.classList.add("spin");
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!document.startViewTransition || reduce){ applyTheme(next); return; }
  const r0 = btn.getBoundingClientRect(), x = r0.left + r0.width/2, y = r0.top + r0.height/2;
  const R = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  const vt = document.startViewTransition(() => applyTheme(next));
  vt.ready.then(() => document.documentElement.animate(
    {clipPath:[`circle(0px at ${x}px ${y}px)`, `circle(${R}px at ${x}px ${y}px)`]},
    {duration:650, easing:"cubic-bezier(.4,0,.2,1)", pseudoElement:"::view-transition-new(root)"})).catch(() => {});
}
applyTheme(savedTheme());
if (inTg) try { tg.onEvent("themeChanged", () => { if (!savedTheme()) applyTheme(null); }); } catch(e){}

/* ============ yordamchilar ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Math.round(n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " so'm";
const haptic = (t="light") => { try { inTg && tg.HapticFeedback.impactOccurred(t); } catch(e){} };
const notifyH = t => { try { inTg && tg.HapticFeedback.notificationOccurred(t); } catch(e){} };
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

function demoLoc(L){
  if(L.type==="point") return [L.lat,L.lon,""];
  if(L.type==="saved"){const a=DEMO_ME.addresses.find(x=>x.id===L.id); if(!a) throw new Error("Manzilni tanlang"); return [a.lat,a.lon,a.title];}
  if(L.type==="place"){const p=DEMO_ME.places.find(x=>x.id===L.id); if(!p) throw new Error("Manzilni tanlang"); return [p.lat,p.lon,p.grp+", "+p.name];}
  if(L.type==="link"){const m=String(L.text).match(/(-?\d{1,3}\.\d+)[,\s]+(-?\d{1,3}\.\d+)/); if(!m) throw new Error("Havoladan manzilni topib bo'lmadi"); let a=+m[1],b=+m[2]; if(a>60){[a,b]=[b,a];} return [a,b,""];}
  throw new Error("Manzilni tanlang");
}
function demoKm(a,b,c,d){const R=6371,r=x=>x*Math.PI/180;const h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function demoQuote(b){
  const items=(b.items||[]).map(it=>[DEMO_DATA.products.find(p=>p.id===it.id),it.qty]).filter(x=>x[0]);
  if(!items.length) throw new Error("Savat bo'sh");
  for(const [p,q] of items) if(q>p.stock) throw new Error(`«${p.name}» dan omborda faqat ${p.stock} dona bor`);
  const [lat,lon]=demoLoc(b.loc||{});
  const km=demoKm(DEMO_ME.center[0],DEMO_ME.center[1],lat,lon), cost=10000+Math.max(0,Math.ceil(km-3))*2000;
  const bonus=items.reduce((s,[p,q])=>s+p.bonus*q,0), charge=Math.max(0,cost-bonus), excess=Math.max(0,bonus-cost);
  const items_total=items.reduce((s,[p,q])=>s+p.price*q,0), bonus_used=Math.min(DEMO_ME.bonus,items_total+charge);
  return {items:items.map(([p,q])=>({id:p.id,name:p.name,price:p.price,qty:q})),items_total,delivery:charge,km:Math.round(km*10)/10,bonus_used,excess,total:items_total+charge-bonus_used};
}
async function api(path, body){
  await new Promise(r=>setTimeout(r,180));
  if(path==="catalog") return DEMO_DATA;
  if(path==="me") return DEMO_ME;
  if(path==="quote") return demoQuote(body);
  if(path==="order"){
    if(!body.phone || body.phone.replace(/\D/g,"").length<9) throw new Error("Telefon raqamni to'liq kiriting");
    const q=demoQuote(body); const list=store.get("demo_orders",[]); const id=1000+list.length+1;
    for(const it of q.items){const p=DEMO_DATA.products.find(x=>x.id===it.id); p.stock-=it.qty;}
    DEMO_ME.bonus-=q.bonus_used;
    list.unshift({id,status:"Kuryer izlanmoqda",color:"blue",created:Math.floor(Date.now()/1000),total:q.total,delivery:q.delivery,pay:body.pay==="cash"?"Naqd":"Pul o'tkazish",items:q.items});
    store.set("demo_orders",list);
    return {ok:true,id,total:q.total,next:"done"};
  }
  if(path==="orders") return {orders:store.get("demo_orders",[])};
  if(path==="profile"){ if(String(body.name||"").trim().length<2) throw new Error("Ismingizni kiriting"); if(String(body.phone).replace(/\D/g,"").length<9) throw new Error("Telefon raqamni to'liq kiriting"); DEMO_ME.name=body.name.trim(); DEMO_ME.phone=body.phone.trim(); return {ok:true,name:DEMO_ME.name,phone:DEMO_ME.phone}; }
  if(path==="address"){ const [lat,lon,label]=demoLoc(body.loc||{}); const rec={id:body.id||demoAid++,title:body.title||"Manzil",details:body.details||"",label,lat,lon};
    const i=DEMO_ME.addresses.findIndex(x=>x.id===rec.id); if(i>=0) DEMO_ME.addresses[i]=rec; else DEMO_ME.addresses.push(rec); return {ok:true,id:rec.id,addresses:DEMO_ME.addresses.slice()}; }
  if(path==="address/delete"){ DEMO_ME.addresses=DEMO_ME.addresses.filter(x=>x.id!==body.id); return {ok:true,addresses:DEMO_ME.addresses.slice()}; }
  throw new Error("?");
}

function descOf(catId){
  const out = new Set([catId]); let grow = true;
  while (grow){ grow = false; for (const c of cats) if (out.has(c.parent) && !out.has(c.id)){ out.add(c.id); grow = true; } }
  return out;
}
const inCat = id => { const ok = descOf(id); return products.filter(p => ok.has(p.cat)); };
function catPath(id){ const a = []; while (id){ const c = catById(id); if (!c) break; a.unshift(c.name); id = c.parent; } return a.join(" › "); }
const pct = p => p.old_price > p.price ? Math.round(100 - p.price*100/p.old_price) : 0;
function totals(){
  let count = 0, sum = 0;
  for (const [id, q] of Object.entries(cart)){ const p = byId(id); if (p){ count += q; sum += p.price*q; } }

}

/* Bir xil "grp" li mahsulotlar katalogda bitta kartochka bo'lib chiqadi, ichida tanlanadi. */
let groups = [], gOf = new Map(), banners = [];
const isBox = p => /karob|korob|blok|quti|yashik/i.test(p.pack || "");
function buildGroups(){
  const m = new Map(); groups = []; gOf = new Map();
  for (const p of products){
    const k = p.grp ? "g:" + p.grp : "p:" + p.id;
    let g = m.get(k);
    if (!g){ const t = p.grp || p.name; g = {key:k, title:(p.grp && t === t.toUpperCase()) ? title(t) : t, items:[]}; m.set(k, g); groups.push(g); }
    g.items.push(p); gOf.set(p.id, g);
  }
  for (const g of groups){
    const its = g.items;
    g.single = its.length === 1;
    g.rep = its.slice().sort((a, b) => (isBox(a) - isBox(b)) || (a.price - b.price))[0];
    g.cat = g.rep.cat;
    g.cats = new Set(its.map(p => p.cat));
    const donas = its.filter(p => !isBox(p)); const base = donas.length ? donas : its;
    g.min = Math.min(...base.map(p => p.price));
    g.diff = base.some(p => p.price !== g.min);
    g.hasBox = its.some(isBox);
    g.pct = Math.max(0, ...its.map(pct));
    g.photo = (its.find(p => p.photo) || {}).photo || "";
    g.stock = its.reduce((s, p) => s + p.stock, 0);
    g.variants = [...new Set(its.map(p => p.variant).filter(Boolean))];
    g.packs = [...new Set(its.map(p => p.pack).filter(Boolean))].sort((a, b) => /karob|korob|blok|quti|yashik/i.test(a) - /karob|korob|blok|quti|yashik/i.test(b));
    g.text = (g.title + " " + its.map(p => p.name + " " + p.variant).join(" ")).toLowerCase();
  }
}
const groupsIn = catId => { const ok = descOf(catId); return groups.filter(g => [...g.cats].some(c => ok.has(c))); };
const gQty = g => g.items.reduce((s, p) => s + (cart[p.id] || 0), 0);

/* ============ rasmlar ============ */
/* Kvadrat rasm katakni to'liq to'ldiradi; kvadrat bo'lmasa — butunligicha, och fonda ko'rsatiladi */
function fitImg(el){
  el.classList.add("ld");
  const r = el.naturalWidth / (el.naturalHeight || 1);
  if (r < .85 || r > 1.18) el.parentNode.classList.add("fit");
}
function imgTag(src, ini){
  return src ? `<img src="${esc(src)}" loading="lazy" alt="" onload="fitImg(this)" onerror="this.outerHTML='<div class=ini>${ini}</div>'">`
             : `<div class="ini">${ini}</div>`;
}
function img(p){ return imgTag(p.photo, esc((p.name||"?").trim().charAt(0).toUpperCase())); }
function photo(p){ return `<div class="ph">${pct(p) ? `<span class="badge">−${pct(p)}%</span>` : ""}${img(p)}</div>`; }
function subOf(p){
  if (p.stock <= 5) return `<div class="sub low">Qoldi ${p.stock} ta</div>`;
  const c = catById(p.cat); return `<div class="sub">${esc(c ? title(c.name) : "")}</div>`;
}
const num = n => Math.round(n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
function priceHtml(p){ return `<div class="price">${pct(p) ? `<s>${fmt(p.old_price)}</s>` : ""}<b class="${pct(p) ? "s" : ""}">${num(p.price)}<small> so'm</small></b></div>`; }
function ctrl(p){
  const q = cart[p.id] || 0;
  if (!q) return `<button class="plus" data-a="inc" data-id="${p.id}" aria-label="Savatga qo'shish">${I.plus}</button>`;
  return `<div class="step"><button data-a="dec" data-id="${p.id}" aria-label="Kamaytirish">${I.minus}</button><b>${q}</b><button class="inc" data-a="inc" data-id="${p.id}" ${q >= p.stock ? "disabled" : ""} aria-label="Ko'paytirish">${I.plus}</button></div>`;
}
function gctrl(g){
  /* Tashqaridagi "+" har doim DONA ni qo'shadi; karobka faqat ichkarida tanlanadi */
  const rep = g.rep, rq = cart[rep.id] || 0, other = gQty(g) - rq;
  if (rq) return ctrl(rep);
  return `<button class="plus" data-a="inc" data-id="${rep.id}" aria-label="Savatga qo'shish (dona)">${I.plus}${other ? `<span class="pq">${other}</span>` : ""}</button>`;
}
function gsub(g){
  const parts = [];
  if (g.variants.length > 1) parts.push(`${g.variants.length} xil`);
  if (g.hasBox) parts.push("dona / karobka");
  else if (g.packs.length > 1) parts.push(g.packs.join(" / ").toLowerCase());
  return `<div class="sub">${esc(parts.join(" · ") || "")}</div>`;
}
function cardHtml(g){
  if (g.single) { const p = g.rep; return `<div class="card">
    <div data-a="open" data-id="${p.id}">${photo(p)}<div class="nm">${esc(p.name)}</div>${subOf(p)}</div>
    <div class="pr">${priceHtml(p)}<div class="ctl" data-ctl="${p.id}">${ctrl(p)}</div></div></div>`; }
  const p = g.rep;
  return `<div class="card">
    <div data-a="open" data-id="${p.id}"><div class="ph">${g.pct ? `<span class="badge">−${g.pct}%</span>` : ""}${imgTag(g.photo || p.photo, esc(g.title.charAt(0).toUpperCase()))}
      ${g.variants.length > 1 ? `<span class="vdots">${g.variants.slice(0, 4).map(() => "<i></i>").join("")}</span>` : ""}</div>
      <div class="nm">${esc(g.title)}</div>${gsub(g)}</div>
    <div class="pr"><div class="price">${p.old_price > p.price && !g.diff ? `<s>${fmt(p.old_price)}</s>` : ""}<b class="${pct(p) && !g.diff ? "s" : ""}">${num(g.diff ? g.min : p.price)}<small> so'm${g.diff ? " dan" : ""}</small></b></div>
      <div class="ctl" data-gctl="${esc(g.key)}">${gctrl(g)}</div></div></div>`;
}
const tileSrc = c => c.img || ((groupsIn(c.id).find(g => g.photo) || {}).photo || "");
function tileImg(c){ return imgTag(tileSrc(c), esc(c.name.charAt(0))); }

/* ============ bannerlar ============ */
function bannersHtml(sale){
  const isDemo = typeof DEMO !== "undefined" && DEMO;
  const slides = [];
  if (banners.length){                       /* admin /banner bilan yuklagan rasmlar (1200×600) */
    for (const b of banners) slides.push(`<button class="banner bimg" ${b.cat ? `data-cat="${b.cat}"` : ""}><img src="${esc(b.img)}" alt="" loading="lazy"></button>`);
  } else for (const b of BANNERS){           /* rasm bo'lmasa — kategoriyalardan avtomatik */
    if (b.demo && !isDemo) continue;
    let cat = null, list = [];
    if (b.match){ cat = kids(0).find(c => c.name.toUpperCase().includes(b.match)); if (!cat) continue; list = groupsIn(cat.id); if (!list.length) continue; }
    const mx = Math.max(0, ...list.map(g => g.pct));
    if (b.sub.includes("{max}") && !mx) continue;
    const pick = list.filter(g => g.photo).sort((a, b2) => b2.pct - a.pct)[0];
    const pic = b.emoji ? `<span class="em">${b.emoji}</span>` : pick ? `<div class="ph">${imgTag(pick.photo, "")}</div>` : "";
    slides.push(`<button class="banner" style="background:linear-gradient(110deg,${b.c1},${b.c2})" ${cat ? `data-cat="${cat.id}"` : `data-a="soon"`}>
      <span class="deco" style="width:120px;height:120px;left:-30px;bottom:-50px"></span><span class="deco" style="width:60px;height:60px;right:38%;top:-22px"></span>
      <div class="bi">${pic}</div><div class="bt"><h3 style="color:#181725">${esc(b.title)}</h3><p>${esc(b.sub.replace("{max}", mx))}</p>${b.soon ? `<span class="soon">TEZ KUNDA</span>` : ""}</div></button>`);
  }
  if (!slides.length && sale.length){
    const best = sale[0];
    slides.push(`<button class="banner" data-a="tosale"><div class="bi"><div class="ph">${imgTag(best.photo, "")}</div></div><div class="bt"><h3>Chegirmalar</h3><p>−${best.pct}% gacha arzon</p></div></button>`);
  }
  if (!slides.length) return "";
  return `<div class="btrack" id="btrack">${slides.join("")}</div>${slides.length > 1 ? `<div class="dots" id="bdots">${slides.map((_, i) => `<i class="${i ? "" : "on"}"></i>`).join("")}</div>` : ""}`;
}
let bTimer = null, bHold = 0;
function startBanners(){
  clearInterval(bTimer);
  const t = $("btrack"); if (!t) return;
  const n = t.children.length; if (n < 2) return;
  const idx = () => Math.round(t.scrollLeft / (t.children[0].offsetWidth + 12));
  t.addEventListener("scroll", () => { const i = idx(); document.querySelectorAll("#bdots i").forEach((d, k) => d.classList.toggle("on", k === i)); }, {passive:true});
  t.addEventListener("touchstart", () => { bHold = Date.now(); }, {passive:true});
  bTimer = setInterval(() => {
    if (view !== "catalog" || query || sheetId || Date.now() - bHold < 6000 || !document.body.contains(t)) return;
    const i = (idx() + 1) % n;
    t.scrollTo({left: i * (t.children[0].offsetWidth + 12), behavior: "smooth"});
  }, 4500);
}

/* ============ bosh sahifa ============ */
function renderHome(){
  const h = $("home");
  if (query){
    const ql = query.toLowerCase();
    const list = groups.filter(g => g.text.includes(ql) || [...g.cats].some(c => catPath(c).toLowerCase().includes(ql)));
    h.innerHTML = `<div class="sec"><h2>Qidiruv natijasi</h2><span>${list.length} ta</span></div>` +
      (list.length ? `<div class="grid">${list.map(cardHtml).join("")}</div>` : `<div class="empty"><div class="e">🔎</div><p>Hech narsa topilmadi</p></div>`);
    return;
  }
  const sale = groups.filter(g => g.pct).sort((a, b) => b.pct - a.pct);
  const top = kids(0);
  let html = "";
  html += bannersHtml(sale);
  if (sale.length) html += `<div class="sec" id="saleSec"><h2>Aksiya</h2><span>${sale.length} ta</span></div><div class="rail">${sale.map(cardHtml).join("")}</div>`;
  if (top.length) html += `<div class="sec"><h2>Kategoriyalar</h2><button data-go="explore">Barchasi</button></div>
    <div class="crail">${top.map((c,i) => `<button class="ctile" style="${ctileStyle(i)}" data-cat="${c.id}"><div class="ti">${tileImg(c)}</div><b>${esc(title(c.name))}</b></button>`).join("")}</div>`;
  for (const c of top){
    const list = groupsIn(c.id); if (!list.length) continue;
    html += `<div class="sec"><h2>${esc(title(c.name))}</h2><button data-cat="${c.id}">Barchasi</button></div><div class="rail">${list.slice(0, 10).map(cardHtml).join("")}</div>`;
  }
  const orphans = groups.filter(g => !g.cat || !catById(g.cat));
  if (orphans.length) html += `<div class="sec"><h2>Boshqa mahsulotlar</h2></div><div class="grid">${orphans.map(cardHtml).join("")}</div>`;
  if (!products.length) html += `<div class="empty"><div class="e">📦</div><p>Hozircha mahsulotlar yo'q</p></div>`;
  h.innerHTML = html;
  startBanners();
}

/* ============ katalog (Explore) ============ */
function renderExplore(){
  const top = kids(0);
  $("v-explore").innerHTML = `<div class="ptitle">Katalog</div>
    <div class="tiles">${top.map((c,i) => `<button class="tile" style="${tileStyle(i)}" data-cat="${c.id}"><div class="ti">${tileImg(c)}</div><div><b>${esc(title(c.name))}</b><small>${groupsIn(c.id).length} ta mahsulot</small></div></button>`).join("")
      || `<div class="empty" style="grid-column:1/-1"><div class="e">📦</div><p>Kategoriyalar yo'q</p></div>`}</div>`;
}

/* ============ kategoriya sahifasi (shablon: Beverages) ============ */
function openCat(id){
  if (view !== "category") catFrom = view;
  path = [id]; go("category");
}
function renderCategory(){
  if (!path.length){ go(catFrom); return; }
  const last = path[path.length-1], lk = kids(last);
  let chips = "";
  let parent = null, list = [], sel = null;
  if (lk.length){ parent = last; list = lk; }
  else if (path.length > 1){ parent = path[path.length-2]; list = kids(parent); sel = last; }
  if (parent !== null){
    const lvl = path.indexOf(parent) + 1;
    chips = `<div class="subchips"><button class="chip ${sel ? "" : "on"}" data-cat="${parent}" data-lvl="${lvl-1}">Hammasi</button>` +
      list.map(c => `<button class="chip ${sel === c.id ? "on" : ""}" data-cat="${c.id}" data-lvl="${lvl}">${esc(title(c.name))}</button>`).join("") + `</div>`;
  }
  const items = groupsIn(last), head = catById(path[0]);
  $("v-category").innerHTML = `<div class="ptitle"><button class="bk" data-a="catback" aria-label="Orqaga">${I.back}</button>${esc(title(head ? head.name : ""))}</div>${chips}
    ${items.length ? `<div class="grid">${items.map(cardHtml).join("")}</div>` : `<div class="empty"><div class="e">📦</div><p>Bu bo'limda hozircha mahsulot yo'q</p></div>`}`;
}

function refreshCtl(id){
  const p = byId(id); if (!p) return;
  document.querySelectorAll(`[data-ctl="${p.id}"]`).forEach(el => el.innerHTML = ctrl(p));
  const g = gOf.get(p.id);
  if (g && !g.single) document.querySelectorAll(`[data-gctl="${CSS.escape(g.key)}"]`).forEach(el => el.innerHTML = gctrl(g));
}

/* ============ mahsulot sahifasi ============ */
let sheetId = null, sheetQty = 1;
function openSheet(id){
  const p = byId(id); if (!p) return;
  sheetId = +id; sheetQty = cart[sheetId] || 1;      /* kartochkadan kirilsa — har doim DONA */
  renderSheet();
  $("sheet").scrollTop = 0;
  $("sbg").classList.add("on"); $("sheet").classList.add("on");
  syncBack(); syncMain();
}
function pickVariant(v, pk){                           /* tanlangan ta'm + qadoqqa mos mahsulot */
  const g = gOf.get(sheetId); if (!g) return;
  const its = g.items;
  const hit = its.find(p => p.variant === v && p.pack === pk) || its.find(p => p.variant === v) || its.find(p => p.pack === pk);
  if (hit && hit.id !== sheetId){ sheetId = hit.id; sheetQty = cart[hit.id] || 1; haptic("soft"); renderSheet(); }
}
function renderSheet(){
  const p = byId(sheetId); if (!p) return;
  const g = gOf.get(p.id) || {single:true, items:[p], variants:[], packs:[], title:p.name};
  const inC = cart[p.id] || 0;
  const multi = !g.single;
  let opts = "";
  if (multi && g.variants.length > 1){
    opts += `<div class="opt"><div class="ol">Turi: <b>${esc(p.variant)}</b></div><div class="vchips">${g.variants.map(v => {
      const has = g.items.some(x => x.variant === v && (!p.pack || x.pack === p.pack));
      const any = g.items.find(x => x.variant === v && x.photo);
      return `<button class="vchip ${v === p.variant ? "on" : ""} ${has ? "" : "dim"}" data-a="pickv" data-v="${esc(v)}">${any ? `<span class="vt">${imgTag(any.photo, "")}</span>` : ""}${esc(v)}</button>`;
    }).join("")}</div></div>`;
  }
  if (multi && g.packs.length > 1){
    const dona = g.items.find(x => x.variant === p.variant && !isBox(x));
    opts += `<div class="opt"><div class="ol">Qadoq</div><div class="packs">${g.packs.map(pk => {
      const x = g.items.find(y => y.variant === p.variant && y.pack === pk) || g.items.find(y => y.pack === pk);
      /* "1 donasi" — karobka narxidan hisoblanadi va yuzlikkacha yaxlitlanadi. Narxning o'zi o'zgarmaydi. */
      const box = isBox(x), unit = box && x.pack_qty ? Math.round(x.price / x.pack_qty / 100) * 100 : 0;
      const save = box && dona && unit && unit < dona.price ? Math.round(100 - unit * 100 / dona.price) : 0;
      return `<button class="pk ${pk === p.pack ? "on" : ""}" data-a="pickp" data-p="${esc(pk)}">
        <b>${esc(pk)}${box && x.pack_qty ? ` · ${x.pack_qty} ta` : ""}</b><span>${fmt(x.price)}</span>
        ${unit ? `<small>1 donasi ≈ ${fmt(unit)}${save >= 1 ? ` · <em>−${save}%</em>` : ""}</small>` : `<small>&nbsp;</small>`}</button>`;
    }).join("")}</div></div>`;
  }
  $("sheet").innerHTML = `
    <div class="hero"><button class="x" data-a="close" aria-label="Yopish">${I.back}</button>${pct(p) ? `<span class="badge">−${pct(p)}%</span>` : ""}<div class="hi">${img(p)}</div></div>
    <div class="in">
      <div class="tt"><div><h3>${esc(multi ? g.title : p.name)}</h3><div class="sub">${esc(multi ? [p.variant, p.pack].filter(Boolean).join(" · ") : (catById(p.cat) ? title(catPath(p.cat)) : ""))}</div></div></div>
      ${opts}
      <div class="qrow">
        <div class="qty"><button data-a="sdec" ${sheetQty <= 1 ? "disabled" : ""} aria-label="Kamaytirish">${I.minus}</button><b>${sheetQty}</b><button class="inc" data-a="sinc" ${sheetQty >= p.stock ? "disabled" : ""} aria-label="Ko'paytirish">${I.plus}</button></div>
        <div class="bigp">${pct(p) ? `<s>${fmt(p.old_price * sheetQty)}</s>` : ""}<b class="${pct(p) ? "s" : ""}">${fmt(p.price * sheetQty)}</b></div>
      </div>
      <details class="det"><summary><span><span class="di">📄</span>Tavsif</span>${I.chev}</summary><p>${p.desc ? esc(p.desc) : "Mahsulot haqida batafsil ma'lumot tez orada qo'shiladi."}</p></details>
      ${noteFor(p.cat) ? `<details class="det"><summary><span><span class="di">💬</span>Tasnif</span>${I.chev}</summary><p class="note-t">${esc(noteFor(p.cat))}</p></details>` : ""}
      <div class="drow">Omborda <span>${p.stock} ta</span></div>
      ${pct(p) ? `<div class="drow">Tejaysiz <span style="color:var(--sale)">${fmt((p.old_price - p.price) * sheetQty)}</span></div>` : ""}
      <div class="drow">Yetkazib berish <span>Uyingizgacha</span></div>
      <div class="cta"><button class="btn block" data-a="sadd">${inC ? (inC === sheetQty ? "Savatda bor · Savatga o'tish" : "Savatni yangilash") : "Savatga qo'shish"}</button></div>
    </div>`;
}
/* «Tasnif»: mahsulot kategoriyasi yoki uning ota kategoriyasidagi eslatma (/eslatma buyrug'i) */
function noteFor(catId){ let id = catId; while (id){ const c = catById(id); if (!c) break; if (c.note) return c.note; id = c.parent; } return ""; }
function closeSheet(){ sheetId = null; $("sbg").classList.remove("on"); $("sheet").classList.remove("on"); syncBack(); syncMain(); }

/* ============ savat (shablon: My Cart) ============ */
function cartItems(){ return Object.entries(cart).map(([id, q]) => [byId(id), q]).filter(x => x[0]); }
function renderCart(){
  const items = cartItems(), t = totals();
  if (!items.length){
    $("v-cart").innerHTML = `<div class="ptitle">Savat</div><div class="hr"></div><div class="empty"><div class="e">🛒</div><p>Savatingiz hozircha bo'sh</p><button class="btn" data-go="catalog">Xarid qilish</button></div>`;
    return;
  }
  $("v-cart").innerHTML = `<div class="ptitle">Savat</div><div class="hr"></div>
    ${items.map(([p, q]) => `<div class="row">
      <div data-a="open" data-id="${p.id}">${photo(p)}</div>
      <div class="mid"><div class="nm">${esc(p.grp ? (gOf.get(p.id) || {}).title || p.grp : p.name)}</div>${p.grp ? `<div class="sub">${esc([p.variant, p.pack].filter(Boolean).join(" · "))}</div>` : subOf(p)}
        <div class="rb"><div data-ctl="${p.id}">${ctrl(p)}</div><span class="rp">${fmt(p.price*q)}</span></div></div>
      <button class="rm" data-a="rm" data-id="${p.id}" aria-label="Olib tashlash">${I.x}</button>
    </div>`).join("")}
    <div class="sum">
      <div><span>Mahsulotlar (${t.count} ta)</span><b>${fmt(t.sum)}</b></div>
      <div><span>Yetkazib berish</span><b class="muted" style="font-weight:500">manzilga qarab</b></div>
    </div>
    ${me && me.bonus ? `<div class="note gift">🎁 <div>Bonus hisobingizda <b>${fmt(me.bonus)}</b> bor — buyurtmada avtomatik ishlatiladi.</div></div>` : ""}
    <div class="note info">🚚 <div>Ko'p mahsulot olsangiz, yetkazib berish arzonlashadi yoki <b>bepul</b> bo'ladi.</div></div>`;
}
function changeQty(id, d){
  const p = byId(id); if (!p) return;
  const q = (cart[id] || 0) + d;
  if (q > p.stock){ toast(`Omborda faqat ${p.stock} ta bor`); notifyH("warning"); return; }
  setQty(id, q); haptic();
}
function setQty(id, q){
  if (q <= 0) delete cart[id]; else cart[id] = q;
  saveCart(); refreshCtl(id); updateBadge();
  if (view === "cart") renderCart();
  if (view === "checkout") requestQuote();
  syncMain();
}
function updateBadge(){ const t = totals(); $("nb").style.display = t.count ? "flex" : "none"; $("nb").textContent = t.count; }

function setMode(m){
  LS.mode = m; saveLS(); haptic("soft");
  document.querySelectorAll("#seg button").forEach(b => b.classList.toggle("on", b.dataset.mode === m));
  ["saved","map","place","link"].forEach(k => { const x = $("m-"+k); if (x) x.classList.toggle("hide", k !== m); });

function fillPlaces(){

  const g = $("grp").value;
  const list = me.places.filter(p => p.grp === g);
  sel.innerHTML = `<option value="">${g ? "Tanlang" : "Avval hududni tanlang"}</option>` +
    list.map(p => `<option value="${p.id}" ${+LS.place===p.id?"selected":""}>${esc(p.name)}</option>`).join("");

function initMap(){
  const box = $("m-map"); if (!box || !$("map")) return;
  if (!window.L){ const w = box.querySelector(".mapwrap"); if (w) w.innerHTML = `<div class="empty" style="padding:30px 12px">Xarita yuklanmadi.<br>«Havola» yoki «Mo'ljal» orqali tanlang.</div>`; return; }
  const p0 = LS.pt, c = p0 ? [p0.lat, p0.lon] : (me ? me.center : [41.12, 72.07]);
  if (map){ map.remove(); map = null; }
  map = L.map("map", {zoomControl:false, attributionControl:true}).setView(c, p0 ? 17 : 14);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:"© OpenStreetMap"}).addTo(map);
  map.on("dragstart zoomstart", () => { mapMovedByUser = true; $("pin").classList.add("up"); });
  map.on("moveend", () => {
    $("pin").classList.remove("up");
    if (!mapMovedByUser) return;
    mapMovedByUser = false; setPoint(map.getCenter().lat, map.getCenter().lng, false);
  });
  setTimeout(() => map && map.invalidateSize(), 200);
}
function setPoint(lat, lon, fly){
  LS.pt = {lat:+lat.toFixed(6), lon:+lon.toFixed(6)};
  if (LS === co){ lastLoc = co.pt; store.set("mg_loc", lastLoc); }
  const h = $("maphint"); if (h) h.classList.add("hide");
  if (fly && map) map.setView([lat, lon], 17);
  onLocChange();
}
function geolocate(){
  const ok = pos => { setPoint(pos.lat, pos.lon, true); notifyH("success"); };
  const fail = msg => toast(msg || "Joylashuvni aniqlab bo'lmadi — xaritani o'zingiz suring");
  if (inTg && ver("8.0") && tg.LocationManager){
    const lm = tg.LocationManager;
    const get = () => lm.getLocation(d => {
      if (d) ok({lat:d.latitude, lon:d.longitude});
      else if (lm.isLocationAvailable && !lm.isAccessGranted && lm.isAccessRequested) { fail("Joylashuvga ruxsat berilmagan"); try { lm.openSettings(); } catch(e){} }
      else fail();
    });
    if (lm.isInited) get(); else lm.init(get);
    return;
  }
  if (!navigator.geolocation) return fail();
  navigator.geolocation.getCurrentPosition(p => ok({lat:p.coords.latitude, lon:p.coords.longitude}), () => fail(), {enableHighAccuracy:true, timeout:12000});
}
function locPayload(st = LS){
  if (st.mode === "saved") return st.saved ? {type:"saved", id:+st.saved} : null;
  if (st.mode === "map") return st.pt ? {type:"point", lat:st.pt.lat, lon:st.pt.lon} : null;
  if (st.mode === "place") return st.place ? {type:"place", id:+st.place} : null;
  if (st.mode === "link") return (st.link||"").trim().length > 5 ? {type:"link", text:st.link.trim()} : null;
  return null;
}

const orderBody = () => ({
  items: cartItems().map(([p, q]) => ({id:p.id, qty:q})),
  loc: locPayload(co), address: co.mode === "saved" ? "" : co.addr, note: co.note, phone: co.phone || (me && me.phone) || "", pay: co.pay
});
let qTimer;
function requestQuote(){
  clearTimeout(qTimer);
  qTimer = setTimeout(async () => {
    if (view !== "checkout") return;
    const body = orderBody();
    if (!body.items.length){ go("cart"); return; }
    if (!body.loc){ quote = null; quoteErr = ""; renderQuote(); return; }
    const seq = ++quoteSeq;
    try { const q = await api("quote", body); if (seq !== quoteSeq) return; quote = q; quoteErr = ""; }
    catch(e){ if (seq !== quoteSeq) return; quote = null; quoteErr = e.message; }
    renderQuote();
  }, 350);
}
function renderQuote(){
  const box = $("qbox"); if (!box) return;
  const t = totals();
  if (!quote){
    box.innerHTML = `<div><span>Mahsulotlar (${t.count} ta)</span><b>${fmt(t.sum)}</b></div>
      <div><span>Yetkazib berish</span><b class="muted" style="font-weight:500">${locPayload(co) ? "hisoblanmoqda…" : "manzilni tanlang"}</b></div>
      ${quoteErr ? `<div class="err" style="border:0">${esc(quoteErr)}</div>` : ""}`;
  } else {
    box.innerHTML = `<div><span>Mahsulotlar (${t.count} ta)</span><b>${fmt(quote.items_total)}</b></div>
      <div class="${quote.delivery ? "" : "g"}"><span>Yetkazib berish · ${quote.km} km</span><b>${quote.delivery ? fmt(quote.delivery) : "Bepul"}</b></div>
      ${quote.bonus_used ? `<div class="g"><span>Bonus hisobidan</span><b>−${fmt(quote.bonus_used)}</b></div>` : ""}

  }

async function submit(){
  if (busy) return;
  co.phone = ($("phone") && $("phone").value.trim()) || co.phone; saveCo();
  const body = orderBody();
  if (!body.loc){ toast("Avval manzilni tanlang"); notifyH("error"); return; }
  if (body.phone.replace(/\D/g, "").length < 9){ toast("Telefon raqamni to'liq kiriting"); $("phone").focus(); notifyH("error"); return; }
  if (!quote){ toast(quoteErr || "Narx hisoblanmoqda, biroz kuting"); return; }
  busy = true; syncMain();
  try {
    const res = await api("order", body);
    lastOrder = {loc: body.loc, details: co.addr};
    notifyH("success");
    cart = {}; saveCart(); updateBadge();
    if (me && quote.bonus_used) me.bonus = Math.max(0, me.bonus - quote.bonus_used);
    showDone(res);
  } catch(e){ toast(e.message); notifyH("error"); }
  finally { busy = false; syncMain(); }
}
function showDone(res){
  const conf = [["#53b175",14,"8%","10%"],["#f3603f",8,"86%","4%"],["#f8a44c",10,"2%","62%"],["#5b8def",12,"90%","70%"],["#d3b0e0",9,"20%","92%"],["var(--brand-2)",11,"72%","94%"]]
    .map(([c,s,x,y]) => `<i style="background:${c};width:${s}px;height:${s}px;left:${x};top:${y}"></i>`).join("");
  const check = `<div class="ok">${conf}<div class="c"><svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div></div>`;
  let body = "";
  if (res.next === "receipt"){
    body = `<p>Jami <b>${fmt(res.total)}</b> ni quyidagi kartaga o'tkazing va chek rasmini botga yuboring.</p>
      <div class="cardnum"><span id="cardn">${esc(res.card)}</span><button data-a="copy">Nusxa</button></div>`;
  } else if (res.next === "invoice"){
    body = `<p>To'lov tugmasini botga yubordik. To'lov o'tishi bilan buyurtma yo'lga chiqadi.</p>`;
  } else {
    body = `<p>Buyurtma #${res.id} · Jami ${fmt(res.total)}.<br>Kuryer topilishi bilan botda xabar beramiz.</p><div class="note info" style="text-align:left;margin:-8px 0 18px">ℹ️ <div>Bu namuna rejim — buyurtma hech qayerga yuborilmadi. Haqiqiy versiyada admin va kuryerlarga boradi.</div></div>`;
  }
  const offer = lastOrder && lastOrder.loc && lastOrder.loc.type !== "saved" && me && !(me.addresses || []).length;
  $("v-done").innerHTML = `<div class="done">${check}<h2>Buyurtmangiz<br>qabul qilindi</h2>${body}
    <div style="display:grid;gap:6px">
      ${offer ? `<button class="btn soft block" data-a="savehome">🏠 Bu manzilni «Uy» deb saqlash</button>` : ""}
      <button class="btn block" data-go="orders">Buyurtmani kuzatish</button>

    </div></div>`;
  go("done");
}

  if (busy) return;
  const loc = locPayload(af);
  if (!loc){ toast("Manzilni xaritada belgilang"); notifyH("error"); return; }
  const title = af.title || ($("af-title") && $("af-title").value.trim()) || "Manzil";
  busy = true; syncMain();
  try {
    const r = await api("address", {id:af.id, title, details:$("af-details").value.trim(), loc});
    me.addresses = r.addresses; notifyH("success"); toast("Manzil saqlandi");
    if (addrFrom === "checkout"){ co.mode = "saved"; co.saved = r.id; saveCo(); go("checkout"); } else go("addresses");
  } catch(e){ toast(e.message); notifyH("error"); }
  finally { busy = false; syncMain(); }
}
async function delAddr(id){
  try { const r = await api("address/delete", {id:+id}); me.addresses = r.addresses; if (+co.saved === +id){ co.saved = ""; saveCo(); } renderAddresses(); haptic(); toast("Manzil o'chirildi"); }
  catch(e){ toast(e.message); }
}
async function saveLastAsHome(btn){
  if (!lastOrder || !lastOrder.loc) return;
  btn.disabled = true;
  try { const r = await api("address", {title:"Uy", details:lastOrder.details, loc:lastOrder.loc}); me.addresses = r.addresses; btn.outerHTML = `<p class="muted small" style="margin:4px 0 10px">✓ «Uy» manzili saqlandi</p>`; notifyH("success"); }
  catch(e){ toast(e.message); btn.disabled = false; }
}
let lastOrder = null;

/* ============ navigatsiya va asosiy tugma ============ */
let mainFn = null;
function setMain(text, fn){
  mainFn = fn;
  if (inTg){
    const mb = tg.MainButton;
    if (!text){ mb.hide(); return; }
    mb.setParams({text, color:getComputedStyle(document.documentElement).getPropertyValue("--brand").trim() || "#d82c90", text_color:"#ffffff", is_active:!busy, is_visible:true});
    busy ? mb.showProgress(false) : mb.hideProgress();
  } else {
    const f = $("fab"); f.style.display = text ? "block" : "none"; f.textContent = busy ? "Yuborilmoqda…" : text; f.disabled = busy;
  }
}
if (inTg) tg.MainButton.onClick(() => mainFn && !busy && mainFn());
$("fab").onclick = () => mainFn && !busy && mainFn();
function syncMain(){
  const t = totals();
  if (sheetId){ setMain("", null); return; }
  if (view === "catalog" || view === "category" || view === "explore") setMain(t.count ? `Savatga o'tish · ${fmt(t.sum)}` : "", () => go("cart"));
  else if (view === "cart") setMain(t.count ? `Rasmiylashtirish · ${fmt(t.sum)}` : "", () => go("checkout"));
  else if (view === "editprofile") setMain(busy ? "Saqlanmoqda…" : "Saqlash", saveProfile);
  else if (view === "addr") setMain(busy ? "Saqlanmoqda…" : "Manzilni saqlash", saveAddr);
  else if (view === "checkout" && (inTg || (typeof DEMO !== "undefined" && DEMO))) setMain(busy ? "Yuborilmoqda…" : quote ? `Buyurtma berish · ${fmt(quote.total)}` : "Buyurtma berish", submit);
  else setMain("", null);
}
function syncBack(){
  if (!inTg) return;
  (sheetId || view !== "catalog") ? tg.BackButton.show() : tg.BackButton.hide();
}
if (inTg) tg.BackButton.onClick(() => {
  if (sheetId) return closeSheet();
  if (view === "checkout") return go("cart");
  if (view === "category") return catBack();
  if (view === "editprofile") return go("profile");
  if (view === "addresses") return go(addrFrom);
  if (view === "addr") return go("addresses");
  go("catalog");
});
function catBack(){ if (path.length > 1){ path.pop(); renderCategory(); } else go(catFrom); }
function go(v){
  if (sheetId) closeSheet();
  if (map){ map.remove(); map = null; }
  if (view === "checkout" || view === "addr") $("v-" + view).innerHTML = "";
  view = v;
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("on", s.id === "v-" + v));
  const navKey = v === "category" ? (catFrom === "explore" ? "explore" : "catalog") : ["editprofile","addresses","addr"].includes(v) ? "profile" : v;
  document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("on", b.dataset.go === navKey));
  const nonav = ["checkout","done","editprofile","addr"].includes(v);
  $("nav").classList.toggle("hide", nonav); document.body.classList.toggle("nonav", nonav);
  if (v === "catalog") renderHome();
  if (v === "explore") renderExplore();
  if (v === "category") renderCategory();
  if (v === "cart") renderCart();
  if (v === "checkout"){ quote = null; quoteErr = ""; renderCheckout(); }
  if (v === "orders") renderOrders();
  if (v === "profile") renderProfile();
  if (v === "editprofile") renderEditProfile();
  if (v === "addresses") renderAddresses();
  if (v === "addr") renderAddrForm();
  window.scrollTo(0, 0);
  syncBack(); syncMain();
}

/* ============ hodisalar ============ */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a],[data-go],[data-cat],[data-mode],[data-pay],[data-saved],[data-title]");
  if (!el) return;
  const d = el.dataset;
  if (d.go){ go(d.go); return; }
  if (d.cat !== undefined){
    const id = +d.cat; haptic("soft");
    if (view === "category" && d.lvl !== undefined){ path = path.slice(0, +d.lvl); if (!path.length || path[path.length-1] !== id) path.push(id); renderCategory(); window.scrollTo(0,0); }
    else openCat(id);
    return;
  }
  if (d.mode){ if (LS === co) co.modeTouched = true; setMode(d.mode); return; }
  if (d.saved){
    LS.saved = +d.saved; haptic("soft");
    document.querySelectorAll("[data-saved]").forEach(b => b.classList.toggle("on", b === el));
    onLocChange(); return;
  }
  if (d.title !== undefined && view === "addr"){
    af.title = d.title; haptic("soft");
    document.querySelectorAll("[data-title]").forEach(b => b.classList.toggle("on", b === el));
    $("tcustom").classList.toggle("hide", !!d.title); if (!d.title){ af.title = $("af-title").value.trim(); $("af-title").focus(); }
    return;
  }
  if (d.pay){
    if (el.disabled) return;
    co.pay = d.pay; saveCo(); haptic("soft");
    document.querySelectorAll("[data-pay]").forEach(b => b.classList.toggle("on", b === el)); return;
  }
  const a = d.a, id = d.id;
  if (a === "inc") changeQty(id, 1);
  else if (a === "dec") changeQty(id, -1);
  else if (a === "rm"){ setQty(id, 0); haptic(); }
  else if (a === "open") openSheet(id);
  else if (a === "close") closeSheet();
  else if (a === "catback") catBack();
  else if (a === "theme"){ toggleTheme(el); }
  else if (a === "toaddresses"){ addrFrom = "profile"; go("addresses"); }
  else if (a === "addrsfromco"){ addrFrom = "checkout"; go("addresses"); }
  else if (a === "addrback"){ go(addrFrom); }
  else if (a === "newaddr"){ openAddrForm(null); }
  else if (a === "editaddr"){ openAddrForm((me.addresses || []).find(x => x.id === +id)); }
  else if (a === "deladdr"){
    if (el.dataset.sure){ delAddr(id); }
    else { el.dataset.sure = "1"; el.style.color = "var(--red)"; toast("O'chirish uchun yana bir bor bosing"); setTimeout(() => { delete el.dataset.sure; el.style.color = ""; }, 3000); }
  }
  else if (a === "savehome") saveLastAsHome(el);
  else if (a === "bonusinfo") toast(me && me.bonus ? `Bonus: ${fmt(me.bonus)} — keyingi buyurtmada avtomatik ishlatiladi` : "Ko'p mahsulot olganingizda bonus to'planadi");
  else if (a === "support"){ const u = me.support.username; inTg ? tg.openTelegramLink("https://t.me/" + u) : window.open("https://t.me/" + u, "_blank"); }
  else if (a === "callsup"){
    const ph = me.support.phone.replace(/\s/g, "");
    (navigator.clipboard ? navigator.clipboard.writeText(ph) : Promise.reject()).then(() => toast(`${me.support.phone} — nusxalandi`), () => toast(me.support.phone));
  }
  else if (a === "soon"){ toast("Dorixona bo'limi tez orada ochiladi"); haptic(); }
  else if (a === "tosale"){ const s = $("saleSec"); if (s) s.scrollIntoView({behavior:"smooth"}); }
  else if (a === "pickv"){ pickVariant(el.dataset.v, byId(sheetId).pack); }
  else if (a === "pickp"){ pickVariant(byId(sheetId).variant, el.dataset.p); }
  else if (a === "sinc" || a === "sdec"){
    const p = byId(sheetId); sheetQty = Math.max(1, Math.min(p.stock, sheetQty + (a === "sinc" ? 1 : -1))); haptic(); renderSheet();
  }
  else if (a === "sadd"){
    const p = byId(sheetId); const was = cart[p.id] || 0;
    if (was === sheetQty){ go("cart"); return; }
    setQty(p.id, sheetQty); notifyH("success");
    toast(was ? "Savat yangilandi" : "Savatga qo'shildi"); closeSheet();
  }
  else if (a === "geo") geolocate();
  else if (a === "contact"){
    tg.requestContact((ok, r) => {
      const ph = ok && r && r.responseUnsafe && r.responseUnsafe.contact && r.responseUnsafe.contact.phone_number;
      if (ph){ const v = (ph.startsWith("+") ? "" : "+") + ph; const inp = $(el.dataset.target || "phone"); if (inp) inp.value = v; if (!el.dataset.target){ co.phone = v; saveCo(); } notifyH("success"); }
    });
  }
  else if (a === "copy"){
    const txt = $("cardn").textContent.replace(/\s/g, "");
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast("Karta raqami nusxalandi"), () => toast(txt));
  }
  else if (a === "tochat"){ try { tg.close(); } catch(e){} }
});
$("sbg").onclick = closeSheet;
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "q"){ query = t.value.trim(); $("qx").classList.toggle("hide", !query); renderHome(); return; }
  if (t.id === "addr"){ co.addr = t.value; saveCo(); }
  if (t.id === "note"){ co.note = t.value; saveCo(); }
  if (t.id === "phone"){ co.phone = t.value; saveCo(); }
  if (t.id === "lnk"){ LS.link = t.value; onLocChange(); }
  if (t.id === "af-title" && af){ af.title = t.value.trim(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "grp"){ LS.grp = t.value; LS.place = ""; fillPlaces(); onLocChange(); }
  if (t.id === "plc"){ LS.place = t.value; onLocChange(); }
});
$("qx").onclick = () => { $("q").value = ""; query = ""; $("qx").classList.add("hide"); renderHome(); };
$("q").addEventListener("keydown", e => { if (e.key === "Enter") e.target.blur(); });

/* ============ ishga tushirish ============ */
(async function init(){
  try {
    const data = await api("catalog");
    products = data.products; cats = data.categories; banners = data.banners || [];
    buildGroups();
  } catch(e){
    $("home").innerHTML = `<div class="empty"><div class="e">😕</div><p>Mahsulotlarni yuklab bo'lmadi</p><button class="btn soft" onclick="location.reload()">Qayta urinish</button></div>`;
    return;
  }
  for (const id of Object.keys(cart)){ const p = byId(id); if (!p) delete cart[id]; else if (cart[id] > p.stock) cart[id] = p.stock; }
  saveCart();
  renderHome(); updateBadge(); syncMain();
  if (inTg || (typeof DEMO !== "undefined" && DEMO)){
    try {
      me = await api("me");
      if (view === "profile") renderProfile();
      if (me.bonus) $("loc").innerHTML = `🎁 <span>Bonus hisobingiz: <b>${fmt(me.bonus)}</b></span>`;
    } catch(e){}
  }
})();
</script>
