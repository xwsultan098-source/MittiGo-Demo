<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mitti Go</title>
<link rel="icon" href="logo.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Uslub: "Online Groceries" (Nectar) Figma shabloni asosida — oq fon, chegarali kartochkalar,
   18px radius, kvadrat "+" tugma, pastel kategoriya plitkalari. Ranglar — Mitti Go logotipidan. */
:root{
  --brand:#d82c90;          /* Mitti Go pushti — asosiy rang (shablondagi yashil o'rnida) */
  --brand-2:#00acee;        /* Mitti Go havorang */
  --navy:#293897;           /* Mitti Go to'q ko'k */
  --on-brand:#fff;
  --sale:#f3603f;
  --ok:#53b175; --amber:#f8a44c; --red:#e5484d;
  --bg:var(--tg-theme-bg-color,#fff);
  --card:var(--tg-theme-bg-color,#fff);
  --text:var(--tg-theme-text-color,#181725);
  --hint:var(--tg-theme-hint-color,#7c7c7c);
  --fill:color-mix(in srgb,var(--text) 5%,var(--bg));      /* shablondagi #F2F3F2 */
  --line:color-mix(in srgb,var(--text) 11%,var(--bg));     /* shablondagi #E2E2E2 */
  --brand-soft:color-mix(in srgb,var(--brand) 11%,var(--bg));
  --r:18px; --rb:17px; --rbig:19px;
  --font:"Outfit","Gilroy",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not(.tg){--bg:#121316;--card:#121316;--text:#f2f2f4;--hint:#8e8e95;color-scheme:dark}
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font:15px/1.35 var(--font);-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(100px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
img{display:block;max-width:100%}
.hide{display:none!important}
.muted{color:var(--hint)}
.small{font-size:13px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ── bosh sahifa tepasi ── */
.top{background:var(--bg);padding:14px 20px 4px;text-align:center}
.logo{display:inline-block;height:42px;width:auto}
.loc{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px;font-weight:600;font-size:15px;color:color-mix(in srgb,var(--text) 80%,var(--bg))}
.loc b{color:var(--brand)}
.search{display:flex;align-items:center;gap:10px;background:var(--fill);border-radius:15px;padding:0 16px;height:52px;margin:18px 0 0;text-align:left}
.search svg{flex:none}
.search input{flex:1;border:0;outline:0;background:none;height:100%;min-width:0;font-size:15px;font-weight:500}
.search input::placeholder{color:var(--hint)}
.search .x{color:var(--hint);font-size:22px;line-height:1;padding:4px}

/* ── banner ── */
.banner{position:relative;display:flex;align-items:center;min-height:115px;border-radius:var(--r);overflow:hidden;margin:20px 0 4px;background:linear-gradient(100deg,color-mix(in srgb,var(--brand) 12%,var(--bg)),color-mix(in srgb,var(--brand-2) 14%,var(--bg)));width:100%;text-align:left}
.banner .bi{width:42%;align-self:stretch;display:flex;align-items:center;justify-content:center;padding:10px}
.banner .bi img{max-height:96px;object-fit:contain;filter:drop-shadow(0 8px 12px rgba(0,0,0,.12))}
.banner .bi .ini{font-size:44px;font-weight:700;color:var(--brand)}
.banner .bt{flex:1;padding:14px 18px 14px 0;text-align:right}
.banner h3{font-size:21px;font-weight:700;line-height:1.15;color:var(--text)}
.banner p{color:var(--brand);font-weight:600;font-size:14px;margin-top:4px}

/* ── bo'lim sarlavhalari ── */
.view{display:none;padding:0 20px 20px}
.view.on{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sec{display:flex;align-items:center;justify-content:space-between;margin:28px 0 16px}
.sec h2{font-size:22px;font-weight:600;letter-spacing:.1px}
.sec button,.sec span{color:var(--brand);font-weight:600;font-size:15px}
.ptitle{position:relative;font-size:20px;font-weight:700;text-align:center;padding:18px 44px 16px}
.ptitle .bk{position:absolute;left:-8px;top:50%;transform:translateY(-50%);width:40px;height:40px;display:grid;place-items:center}
.hr{height:1px;background:var(--line);margin:0 -20px}

/* ── mahsulot kartochkasi (shablon: 173×249, 18px, #E2E2E2) ── */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.rail{display:flex;gap:15px;overflow-x:auto;margin:0 -20px;padding:0 20px 4px;scroll-snap-type:x mandatory;scroll-padding:0 20px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .card{flex:0 0 calc((100vw - 62px) / 2);max-width:200px;scroll-snap-align:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;position:relative;padding:14px 14px 15px;min-width:0}
.ph{position:relative;height:110px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.ph img{max-width:100%;max-height:100%;object-fit:contain;opacity:0;transition:opacity .25s}
.ph img.ld{opacity:1}
.ini{width:84px;height:84px;border-radius:24px;display:grid;place-items:center;font-size:34px;font-weight:700;color:var(--brand);background:var(--brand-soft)}
.badge{position:absolute;top:-4px;left:-4px;background:var(--sale);color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;z-index:1}
.nm{font-size:16px;font-weight:700;line-height:1.15;letter-spacing:.1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.3em}
.sub{color:var(--hint);font-size:14px;font-weight:500;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub.low{color:var(--sale)}
.pr{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;margin-top:auto;padding-top:16px;flex-wrap:wrap}
.price{display:flex;flex-direction:column;min-width:0}
.price b{font-size:17px;font-weight:600;letter-spacing:.1px;white-space:nowrap}
.price b small{font-size:12px;font-weight:600}
.price b.s{color:var(--sale)}
.price s{color:var(--hint);font-size:12.5px;font-weight:500}
.plus{width:42px;height:42px;flex:none;border-radius:var(--rb);background:var(--brand);color:var(--on-brand);display:grid;place-items:center;transition:transform .1s}
.plus:active{transform:scale(.92)}
.ctl:has(.step){flex-basis:100%}
.step{display:flex;align-items:center;justify-content:space-between;gap:6px}
.step button{width:40px;height:40px;border-radius:15px;border:1px solid var(--line);display:grid;place-items:center;color:var(--hint)}
.step button.inc{color:var(--brand)}
.step button:disabled{opacity:.35}
.step b{font-size:17px;font-weight:600;min-width:22px;text-align:center}

/* ── kategoriya plitkalari (shablon: Explore va Groceries) ── */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.tile{border-radius:var(--r);border:1px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px 12px;min-height:190px;text-align:center}
.tile .ti{height:80px;display:flex;align-items:center;justify-content:center}
.tile .ti img{max-height:80px;object-fit:contain}
.tile .ti .ini{width:72px;height:72px;font-size:30px;background:rgba(255,255,255,.55)}
.tile b{font-size:16px;font-weight:700;line-height:1.25;color:#181725}
.tile small{display:block;color:#7c7c7c;font-size:13px;font-weight:500;margin-top:3px}
.crail{display:flex;gap:15px;overflow-x:auto;margin:0 -20px;padding:0 20px 4px;scrollbar-width:none}
.crail::-webkit-scrollbar{display:none}
.ctile{flex:0 0 auto;width:240px;height:105px;border-radius:var(--r);display:flex;align-items:center;gap:14px;padding:0 18px;text-align:left}
.ctile .ti{width:72px;height:72px;flex:none;display:flex;align-items:center;justify-content:center}
.ctile .ti img{max-height:72px;object-fit:contain}
.ctile .ti .ini{width:64px;height:64px;font-size:26px;background:rgba(255,255,255,.55)}
.ctile b{font-size:18px;font-weight:600;color:#3e423f;line-height:1.2}
.subchips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 16px;padding:0 20px;scrollbar-width:none}
.subchips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap;color:color-mix(in srgb,var(--text) 80%,var(--bg))}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}

.empty{text-align:center;color:var(--hint);padding:56px 20px}
.empty .e{font-size:48px;margin-bottom:12px}
.empty p{margin-bottom:18px;font-size:16px}
.btn{height:56px;padding:0 24px;border-radius:var(--rbig);background:var(--brand);color:var(--on-brand);font-weight:600;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn.ghost{background:none;color:var(--text)}
.btn.soft{background:var(--fill);color:var(--text)}
.btn.block{width:100%}
.btn .tag{background:rgba(0,0,0,.14);border-radius:5px;padding:3px 6px;font-size:12px;font-weight:600}
.skel{background:linear-gradient(90deg,var(--fill) 25%,var(--line) 50%,var(--fill) 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--r)}
@keyframes sk{to{background-position:-200% 0}}

/* ── pastki menyu (shablon: oq, yuqori burchaklari yumaloq, soya) ── */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-radius:15px 15px 0 0;box-shadow:0 -10px 37px rgba(0,0,0,.07);display:flex;padding:10px 8px calc(10px + env(safe-area-inset-bottom))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--text);padding:4px 0;position:relative}
.nav button svg{width:25px;height:25px}
.nav button.on{color:var(--brand)}
.nb{position:absolute;top:-2px;left:calc(50% + 6px);background:var(--brand);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;padding:0 5px;display:none;align-items:center;justify-content:center;border:2px solid var(--card)}

/* ── savat (shablon: My Cart) ── */
.row{display:flex;gap:16px;align-items:center;padding:22px 0;border-bottom:1px solid var(--line);position:relative}
.row .ph{width:76px;height:70px;flex:none;margin:0}
.row .ph .ini{width:64px;height:64px;font-size:24px}
.row .badge{display:none}
.row .mid{flex:1;min-width:0;display:flex;flex-direction:column}
.row .nm{min-height:0;padding-right:28px;-webkit-line-clamp:2}
.row .rb{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.row .step{gap:14px}
.row .step button{width:44px;height:44px;border-radius:var(--rb)}
.row .rp{font-size:17px;font-weight:600;white-space:nowrap}
.row .rm{position:absolute;right:-4px;top:16px;width:32px;height:32px;display:grid;place-items:center;color:var(--hint)}
.sum>div{display:flex;justify-content:space-between;gap:10px;padding:16px 0;border-bottom:1px solid var(--line);font-size:16px}
.sum>div span:first-child{color:var(--hint);font-weight:500}
.sum>div b{font-weight:600}
.sum .t{border-bottom:0;font-size:19px}
.sum .t span:first-child{color:var(--text);font-weight:600}
.sum .t b{font-size:20px;font-weight:700}
.sum .g b{color:var(--ok)}
.note{display:flex;gap:10px;align-items:flex-start;padding:13px 15px;border-radius:15px;font-size:14px;line-height:1.4;margin:14px 0 0;background:var(--fill)}
.note.gift{background:color-mix(in srgb,var(--ok) 12%,var(--bg))}
.note.warn{background:color-mix(in srgb,var(--amber) 15%,var(--bg))}
.note.info{background:var(--brand-soft)}

/* ── rasmiylashtirish ── */
.blk{padding:20px 0;border-bottom:1px solid var(--line)}
.blk h3{font-size:18px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.seg{display:flex;background:var(--fill);border-radius:15px;padding:4px;margin-bottom:14px}
.seg button{flex:1;height:38px;border-radius:12px;font-size:14px;font-weight:600;color:var(--hint)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.mapwrap{position:relative;height:220px;border-radius:var(--r);overflow:hidden;background:var(--fill);margin-bottom:12px}
#map{position:absolute;inset:0}
.pin{position:absolute;left:50%;top:50%;z-index:500;transform:translate(-50%,-100%);pointer-events:none;transition:transform .15s}
.pin.up{transform:translate(-50%,-118%)}
.pin svg{filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.pinshadow{position:absolute;left:50%;top:50%;width:10px;height:4px;margin:-2px 0 0 -5px;border-radius:50%;background:rgba(0,0,0,.3);z-index:499;pointer-events:none}
.locbtn{position:absolute;right:10px;bottom:10px;z-index:600;height:40px;padding:0 14px;border-radius:14px;background:var(--card);font-weight:600;font-size:14px;box-shadow:0 2px 10px rgba(0,0,0,.18);display:flex;align-items:center;gap:6px}
.maphint{position:absolute;left:10px;top:10px;right:10px;z-index:600;text-align:center;pointer-events:none}
.maphint span{display:inline-block;background:rgba(24,23,37,.8);color:#fff;font-size:12.5px;padding:6px 12px;border-radius:999px}
.field{display:block;background:var(--fill);border-radius:15px;padding:10px 16px;margin-bottom:12px}
.field small{display:block;color:var(--hint);font-size:12.5px;font-weight:500;margin-bottom:2px}
.field input,.field textarea,.field select{width:100%;border:0;outline:0;background:none;resize:none;padding:2px 0;font-size:16px;font-weight:500}
.field select{appearance:none;-webkit-appearance:none}
.inl{display:flex;gap:10px;align-items:stretch}
.inl .field{flex:1;margin:0}
.inl .btn{height:auto;padding:0 14px;font-size:13px;border-radius:15px;line-height:1.2}
.pay{display:grid;gap:10px}
.pay button{display:flex;gap:14px;align-items:center;text-align:left;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line)}
.pay button.on{border:2px solid var(--brand);padding:13px 15px;background:var(--brand-soft)}
.pay button:disabled{opacity:.45}
.pay .ic{font-size:24px}
.pay b{display:block;font-size:16px;font-weight:600}
.pay small{color:var(--hint);font-size:13px;font-weight:500}
.err{color:var(--red);font-size:14px;padding-top:10px}

/* ── buyurtmalar ── */
.ord{padding:20px 0;border-bottom:1px solid var(--line)}
.ord .oh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.ord .oh b{font-size:18px;font-weight:700}
.st{font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px}
.st.blue{background:var(--brand-soft);color:var(--brand)}
.st.green{background:color-mix(in srgb,var(--ok) 15%,var(--bg));color:var(--ok)}
.st.amber{background:color-mix(in srgb,var(--amber) 18%,var(--bg));color:#c56f12}
.st.red{background:color-mix(in srgb,var(--red) 13%,var(--bg));color:var(--red)}
.ord ul{list-style:none;font-size:14px;color:var(--hint);font-weight:500;margin-bottom:10px}
.ord li{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.ord li span:first-child{flex:1;min-width:0}
.ord li span:last-child{white-space:nowrap}
.ord .of{display:flex;justify-content:space-between;font-size:15px}
.ord .of b{font-weight:700}

/* ── buyurtma qabul qilindi (shablon: order accepted) ── */
.done{text-align:center;padding:40px 4px 10px;position:relative}
.done .ok{position:relative;width:200px;height:200px;margin:0 auto 46px}
.done .ok .c{position:absolute;inset:20px;border-radius:50%;background:var(--brand);display:grid;place-items:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.done .ok .c::after{content:"";position:absolute;inset:9px;border-radius:50%;border:2px solid rgba(255,255,255,.55)}
.done .ok i{position:absolute;border-radius:50%;animation:pop .6s .15s both}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.done h2{font-size:27px;font-weight:600;line-height:1.3;margin-bottom:14px}
.done p{color:var(--hint);font-size:16px;font-weight:500;line-height:1.5;margin:0 auto 24px;max-width:320px}
.cardnum{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--fill);border-radius:15px;padding:16px 18px;font-size:19px;font-weight:600;letter-spacing:1px;margin:0 0 16px}
.cardnum button{font-size:14px;font-weight:600;color:var(--brand);letter-spacing:0}

/* ── mahsulot sahifasi (shablon: Product Detail) ── */
.sbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.sbg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset:0;z-index:41;background:var(--card);overflow:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
.sheet .hero{position:relative;background:var(--fill);border-radius:0 0 25px 25px;height:min(42vh,370px);display:flex;align-items:center;justify-content:center;padding:56px 40px 30px}
.sheet .hero img{max-height:100%;object-fit:contain;filter:drop-shadow(0 18px 22px rgba(0,0,0,.14))}
.sheet .hero .ini{width:150px;height:150px;font-size:64px;border-radius:40px}
.sheet .hero .badge{top:auto;bottom:18px;left:20px;font-size:14px;padding:5px 10px}
.sheet .x{position:absolute;top:12px;left:12px;width:42px;height:42px;border-radius:21px;display:grid;place-items:center;z-index:3}
.sheet .in{padding:24px 24px 0}
.sheet .tt{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sheet h3{font-size:24px;font-weight:700;line-height:1.2;letter-spacing:.1px}
.sheet .sub{font-size:16px;font-weight:600;margin-top:8px}
.sheet .qrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:28px 0 26px;border-bottom:1px solid var(--line)}
.sheet .qty{display:flex;align-items:center;gap:16px}
.sheet .qty button{width:30px;height:46px;display:grid;place-items:center;color:var(--hint)}
.sheet .qty button.inc{color:var(--brand)}
.sheet .qty button:disabled{opacity:.3}
.sheet .qty b{width:46px;height:46px;border-radius:var(--rb);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;font-weight:600}
.sheet .bigp{text-align:right}
.sheet .bigp b{display:block;font-size:24px;font-weight:700;white-space:nowrap}
.sheet .bigp b.s{color:var(--sale)}
.sheet .bigp s{color:var(--hint);font-size:15px;font-weight:500}
.det{border-bottom:1px solid var(--line)}
.det summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:18px 0;font-size:16px;font-weight:600;cursor:pointer}
.det summary::-webkit-details-marker{display:none}
.det summary svg{transition:transform .2s}
.det[open] summary svg{transform:rotate(90deg)}
.det p{color:var(--hint);font-size:14px;font-weight:500;line-height:1.6;padding-bottom:16px;white-space:pre-line}
.drow{display:flex;align-items:center;justify-content:space-between;padding:18px 0;border-bottom:1px solid var(--line);font-size:16px;font-weight:600}
.drow span{background:var(--fill);border-radius:5px;padding:3px 8px;font-size:12px;color:var(--hint);font-weight:600}
.sheet .cta{padding:26px 0 6px}

.fab{position:fixed;left:20px;right:20px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:35;height:60px;border-radius:var(--rbig);background:var(--brand);color:var(--on-brand);font-weight:600;font-size:17px;display:none;box-shadow:0 10px 26px color-mix(in srgb,var(--brand) 35%,transparent)}
.fab:disabled{opacity:.6}
body.nonav .fab{bottom:calc(16px + env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-160%);z-index:60;background:rgba(24,23,37,.94);color:#fff;padding:12px 18px;border-radius:15px;font-size:14.5px;font-weight:500;max-width:calc(100% - 40px);transition:transform .25s;text-align:center}
.toast.on{transform:translate(-50%,0)}
.leaflet-control-attribution{font-size:9px!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<main>
  <section class="view on" id="v-catalog">
    <header class="top" id="top">
      <img class="logo" src="logo.png" alt="Mitti Go">
      <div class="loc" id="loc"><svg width="15" height="18" viewBox="0 0 15 18" fill="currentColor"><path d="M7.5 0A7.5 7.5 0 0 0 0 7.5C0 13 7.5 18 7.5 18S15 13 15 7.5A7.5 7.5 0 0 0 7.5 0zm0 10.2a2.7 2.7 0 1 1 0-5.4 2.7 2.7 0 0 1 0 5.4z"/></svg><span>Uyingizgacha yetkazamiz</span></div>
      <label class="search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Mahsulot qidirish" autocomplete="off" enterkeyhint="search">
        <button class="x hide" id="qx" type="button" aria-label="Tozalash">×</button>
      </label>
    </header>
    <div id="home">
      <div class="skel" style="height:115px;margin-top:20px"></div>
      <div class="sec"><div class="skel" style="height:22px;width:50%"></div></div>
      <div class="grid"><div class="skel" style="height:250px"></div><div class="skel" style="height:250px"></div></div>
    </div>
  </section>
  <section class="view" id="v-explore"></section>
  <section class="view" id="v-category"></section>
  <section class="view" id="v-cart"></section>
  <section class="view" id="v-checkout"></section>
  <section class="view" id="v-done"></section>
  <section class="view" id="v-orders"></section>
</main>

<button class="fab" id="fab"></button>

<nav class="nav" id="nav">
  <button data-go="catalog" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M4 9.5 5.4 4h13.2L20 9.5"/><path d="M4 9.5c0 1.4 1.1 2.5 2.7 2.5S9.3 10.9 9.3 9.5c0 1.4 1.2 2.5 2.7 2.5s2.7-1.1 2.7-2.5c0 1.4 1.1 2.5 2.6 2.5S20 10.9 20 9.5"/><path d="M5.5 12v8h13v-8M10 20v-4.5h4V20"/></svg>Do'kon</button>
  <button data-go="explore">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 6h7M4 12h5M4 18h7"/><circle cx="16" cy="12" r="4"/><path d="m19 15 2.5 2.5"/></svg>Katalog</button>
  <button data-go="cart">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.2 10.6a2 2 0 0 0 2 1.4h7.6a2 2 0 0 0 2-1.5L20.5 8H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>Savat<span class="nb" id="nb"></span></button>
  <button data-go="orders">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Buyurtmalar</button>
</nav>

<div class="sbg" id="sbg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";
/* ============ Telegram ============ */
const tg = window.Telegram && window.Telegram.WebApp;
const inTg = !!(tg && tg.initData);
const ver = v => { try { return tg.isVersionAtLeast(v); } catch(e){ return false; } };
if (tg) {
  tg.ready(); tg.expand();
  if (inTg) document.documentElement.classList.add("tg");
  try { if (ver("6.1")) { tg.setHeaderColor("bg_color"); tg.setBackgroundColor("bg_color"); } } catch(e){}
  try { if (ver("7.7")) tg.disableVerticalSwipes(); } catch(e){}
}

/* ============ yordamchilar ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Math.round(n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " so'm";
const haptic = (t="light") => { try { inTg && tg.HapticFeedback.impactOccurred(t); } catch(e){} };
const notifyH = t => { try { inTg && tg.HapticFeedback.notificationOccurred(t); } catch(e){} };
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const title = s => String(s||"").toLowerCase().replace(/(^|[\s'‘’-])\S/g, m => m.toUpperCase());
let toastT;
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("on"), 2400); }
const I = {
  plus:`<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 2v14M2 9h14"/></svg>`,
  minus:`<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M2 9h14"/></svg>`,
  back:`<svg width="11" height="19" viewBox="0 0 11 19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 1.5 1.5 9.5l8 8"/></svg>`,
  chev:`<svg width="9" height="15" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m1.5 1.5 6 6-6 6"/></svg>`,
  x:`<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m1.5 1.5 11 11M12.5 1.5l-11 11"/></svg>`,
};
/* Shablondagi pastel plitka ranglari */
const PASTEL = ["#53b175","#f8a44c","#f7a593","#d3b0e0","#fde598","#b7dff5"];
const tileStyle = i => { const c = PASTEL[i % PASTEL.length]; return `background:${c}1a;border-color:${c}b3`; };
const ctileStyle = i => { const c = PASTEL[i % PASTEL.length]; return `background:${c}26`; };

async function api(path, body){
  const opt = { headers: { "X-Init-Data": inTg ? tg.initData : "" } };
  if (body !== undefined){ opt.method = "POST"; opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch("api/" + path, opt);
  let data = {}; try { data = await r.json(); } catch(e){}
  if (!r.ok) throw new Error(data.error || "Server bilan bog'lanib bo'lmadi");
  return data;
}

/* ============ holat ============ */
let products = [], cats = [], me = null;
let path = [], query = "", view = "catalog", catFrom = "catalog";
let cart = store.get("mg_cart", {});                  // {mahsulotId: soni}
let co = store.get("mg_co", {mode:"map", pay:"cash", addr:"", note:"", phone:""});
let lastLoc = store.get("mg_loc", null);
let quote = null, quoteErr = "", quoteSeq = 0, busy = false;
const byId = id => products.find(p => p.id === +id);
const catById = id => cats.find(c => c.id === id);
const kids = id => cats.filter(c => c.parent === id);
const saveCart = () => store.set("mg_cart", cart);
const saveCo = () => store.set("mg_co", co);

function descOf(catId){
  const out = new Set([catId]); let grow = true;
  while (grow){ grow = false; for (const c of cats) if (out.has(c.parent) && !out.has(c.id)){ out.add(c.id); grow = true; } }
  return out;
}
const inCat = id => { const ok = descOf(id); return products.filter(p => ok.has(p.cat)); };
function catPath(id){ const a = []; while (id){ const c = catById(id); if (!c) break; a.unshift(c.name); id = c.parent; } return a.join(" › "); }
const pct = p => p.old_price > p.price ? Math.round(100 - p.price*100/p.old_price) : 0;
function totals(){
  let count = 0, sum = 0;
  for (const [id, q] of Object.entries(cart)){ const p = byId(id); if (p){ count += q; sum += p.price*q; } }
  return {count, sum};
}

/* ============ kartochkalar ============ */
function img(p, big){
  const ini = esc((p.name||"?").trim().charAt(0).toUpperCase());
  return p.photo ? `<img src="${esc(p.photo)}" loading="lazy" alt="" onload="this.classList.add('ld')" onerror="this.outerHTML='<div class=ini>${ini}</div>'">`
                 : `<div class="ini">${ini}</div>`;
}
function photo(p){ return `<div class="ph">${pct(p) ? `<span class="badge">−${pct(p)}%</span>` : ""}${img(p)}</div>`; }
function subOf(p){
  if (p.stock <= 5) return `<div class="sub low">Qoldi ${p.stock} ta</div>`;
  const c = catById(p.cat); return `<div class="sub">${esc(c ? title(c.name) : "")}</div>`;
}
const num = n => Math.round(n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
function priceHtml(p){ return `<div class="price">${pct(p) ? `<s>${fmt(p.old_price)}</s>` : ""}<b class="${pct(p) ? "s" : ""}">${num(p.price)}<small> so'm</small></b></div>`; }
function ctrl(p){
  const q = cart[p.id] || 0;
  if (!q) return `<button class="plus" data-a="inc" data-id="${p.id}" aria-label="Savatga qo'shish">${I.plus}</button>`;
  return `<div class="step"><button data-a="dec" data-id="${p.id}" aria-label="Kamaytirish">${I.minus}</button><b>${q}</b><button class="inc" data-a="inc" data-id="${p.id}" ${q >= p.stock ? "disabled" : ""} aria-label="Ko'paytirish">${I.plus}</button></div>`;
}
const cardHtml = p => `<div class="card">
  <div data-a="open" data-id="${p.id}">${photo(p)}<div class="nm">${esc(p.name)}</div>${subOf(p)}</div>
  <div class="pr">${priceHtml(p)}<div class="ctl" data-ctl="${p.id}">${ctrl(p)}</div></div>
</div>`;
const firstPhoto = list => list.find(p => p.photo);
function tileImg(c){ const p = firstPhoto(inCat(c.id)); return p ? img(p) : `<div class="ini">${esc(c.name.charAt(0))}</div>`; }

/* ============ bosh sahifa ============ */
function renderHome(){
  const h = $("home");
  if (query){
    const ql = query.toLowerCase();
    const list = products.filter(p => p.name.toLowerCase().includes(ql) || catPath(p.cat).toLowerCase().includes(ql));
    h.innerHTML = `<div class="sec"><h2>Qidiruv natijasi</h2><span>${list.length} ta</span></div>` +
      (list.length ? `<div class="grid">${list.map(cardHtml).join("")}</div>` : `<div class="empty"><div class="e">🔎</div><p>Hech narsa topilmadi</p></div>`);
    return;
  }
  const sale = products.filter(p => pct(p)).sort((a,b) => pct(b) - pct(a));
  const top = kids(0);
  let html = "";
  if (sale.length){
    const best = sale[0];
    html += `<button class="banner" data-a="tosale"><div class="bi">${img(best)}</div><div class="bt"><h3>Chegirmalar</h3><p>−${pct(best)}% gacha arzon</p></div></button>`;
  } else {
    html += `<div class="banner"><div class="bi"><img src="logo.png" alt="" style="max-height:60px"></div><div class="bt"><h3>Uyingizgacha</h3><p>Ko'p olsangiz — yetkazish bepul</p></div></div>`;
  }
  if (sale.length) html += `<div class="sec" id="saleSec"><h2>Aksiya</h2><span>${sale.length} ta</span></div><div class="rail">${sale.map(cardHtml).join("")}</div>`;
  if (top.length) html += `<div class="sec"><h2>Kategoriyalar</h2><button data-go="explore">Barchasi</button></div>
    <div class="crail">${top.map((c,i) => `<button class="ctile" style="${ctileStyle(i)}" data-cat="${c.id}"><div class="ti">${tileImg(c)}</div><b>${esc(title(c.name))}</b></button>`).join("")}</div>`;
  for (const c of top){
    const list = inCat(c.id); if (!list.length) continue;
    html += `<div class="sec"><h2>${esc(title(c.name))}</h2><button data-cat="${c.id}">Barchasi</button></div><div class="rail">${list.slice(0, 10).map(cardHtml).join("")}</div>`;
  }
  const orphans = products.filter(p => !p.cat || !catById(p.cat));
  if (orphans.length) html += `<div class="sec"><h2>Boshqa mahsulotlar</h2></div><div class="grid">${orphans.map(cardHtml).join("")}</div>`;
  if (!products.length) html += `<div class="empty"><div class="e">📦</div><p>Hozircha mahsulotlar yo'q</p></div>`;
  h.innerHTML = html;
}

/* ============ katalog (Explore) ============ */
function renderExplore(){
  const top = kids(0);
  $("v-explore").innerHTML = `<div class="ptitle">Katalog</div>
    <div class="tiles">${top.map((c,i) => `<button class="tile" style="${tileStyle(i)}" data-cat="${c.id}"><div class="ti">${tileImg(c)}</div><div><b>${esc(title(c.name))}</b><small>${inCat(c.id).length} ta mahsulot</small></div></button>`).join("")
      || `<div class="empty" style="grid-column:1/-1"><div class="e">📦</div><p>Kategoriyalar yo'q</p></div>`}</div>`;
}

/* ============ kategoriya sahifasi (shablon: Beverages) ============ */
function openCat(id){
  if (view !== "category") catFrom = view;
  path = [id]; go("category");
}
function renderCategory(){
  if (!path.length){ go(catFrom); return; }
  const last = path[path.length-1], lk = kids(last);
  let chips = "";
  let parent = null, list = [], sel = null;
  if (lk.length){ parent = last; list = lk; }
  else if (path.length > 1){ parent = path[path.length-2]; list = kids(parent); sel = last; }
  if (parent !== null){
    const lvl = path.indexOf(parent) + 1;
    chips = `<div class="subchips"><button class="chip ${sel ? "" : "on"}" data-cat="${parent}" data-lvl="${lvl-1}">Hammasi</button>` +
      list.map(c => `<button class="chip ${sel === c.id ? "on" : ""}" data-cat="${c.id}" data-lvl="${lvl}">${esc(title(c.name))}</button>`).join("") + `</div>`;
  }
  const items = inCat(last), head = catById(path[0]);
  $("v-category").innerHTML = `<div class="ptitle"><button class="bk" data-a="catback" aria-label="Orqaga">${I.back}</button>${esc(title(head ? head.name : ""))}</div>${chips}
    ${items.length ? `<div class="grid">${items.map(cardHtml).join("")}</div>` : `<div class="empty"><div class="e">📦</div><p>Bu bo'limda hozircha mahsulot yo'q</p></div>`}`;
}

function refreshCtl(id){
  const p = byId(id); if (!p) return;
  document.querySelectorAll(`[data-ctl="${p.id}"]`).forEach(el => el.innerHTML = ctrl(p));
}

/* ============ mahsulot sahifasi ============ */
let sheetId = null, sheetQty = 1;
function openSheet(id){
  const p = byId(id); if (!p) return;
  sheetId = p.id; sheetQty = cart[p.id] || 1;
  renderSheet();
  $("sheet").scrollTop = 0;
  $("sbg").classList.add("on"); $("sheet").classList.add("on");
  syncBack(); syncMain();
}
function renderSheet(){
  const p = byId(sheetId); if (!p) return;
  const inC = cart[p.id] || 0;
  const c = catById(p.cat);
  $("sheet").innerHTML = `
    <div class="hero"><button class="x" data-a="close" aria-label="Yopish">${I.back}</button>${pct(p) ? `<span class="badge">−${pct(p)}%</span>` : ""}${img(p)}</div>
    <div class="in">
      <div class="tt"><div><h3>${esc(p.name)}</h3><div class="sub">${esc(c ? title(catPath(p.cat)) : "")}</div></div></div>
      <div class="qrow">
        <div class="qty"><button data-a="sdec" ${sheetQty <= 1 ? "disabled" : ""} aria-label="Kamaytirish">${I.minus}</button><b>${sheetQty}</b><button class="inc" data-a="sinc" ${sheetQty >= p.stock ? "disabled" : ""} aria-label="Ko'paytirish">${I.plus}</button></div>
        <div class="bigp">${pct(p) ? `<s>${fmt(p.old_price * sheetQty)}</s>` : ""}<b class="${pct(p) ? "s" : ""}">${fmt(p.price * sheetQty)}</b></div>
      </div>
      ${p.desc ? `<details class="det" open><summary>Mahsulot haqida ${I.chev}</summary><p>${esc(p.desc)}</p></details>` : ""}
      <div class="drow">Omborda <span>${p.stock} ta</span></div>
      ${pct(p) ? `<div class="drow">Tejaysiz <span style="color:var(--sale)">${fmt((p.old_price - p.price) * sheetQty)}</span></div>` : ""}
      <div class="drow">Yetkazib berish <span>Uyingizgacha</span></div>
      <div class="cta"><button class="btn block" data-a="sadd">${inC ? (inC === sheetQty ? "Savatda bor · Savatga o'tish" : "Savatni yangilash") : "Savatga qo'shish"}</button></div>
    </div>`;
}
function closeSheet(){ sheetId = null; $("sbg").classList.remove("on"); $("sheet").classList.remove("on"); syncBack(); syncMain(); }

/* ============ savat (shablon: My Cart) ============ */
function cartItems(){ return Object.entries(cart).map(([id, q]) => [byId(id), q]).filter(x => x[0]); }
function renderCart(){
  const items = cartItems(), t = totals();
  if (!items.length){
    $("v-cart").innerHTML = `<div class="ptitle">Savat</div><div class="hr"></div><div class="empty"><div class="e">🛒</div><p>Savatingiz hozircha bo'sh</p><button class="btn" data-go="catalog">Xarid qilish</button></div>`;
    return;
  }
  $("v-cart").innerHTML = `<div class="ptitle">Savat</div><div class="hr"></div>
    ${items.map(([p, q]) => `<div class="row">
      <div data-a="open" data-id="${p.id}">${photo(p)}</div>
      <div class="mid"><div class="nm">${esc(p.name)}</div>${subOf(p)}
        <div class="rb"><div data-ctl="${p.id}">${ctrl(p)}</div><span class="rp">${fmt(p.price*q)}</span></div></div>
      <button class="rm" data-a="rm" data-id="${p.id}" aria-label="Olib tashlash">${I.x}</button>
    </div>`).join("")}
    <div class="sum">
      <div><span>Mahsulotlar (${t.count} ta)</span><b>${fmt(t.sum)}</b></div>
      <div><span>Yetkazib berish</span><b class="muted" style="font-weight:500">manzilga qarab</b></div>
    </div>
    ${me && me.bonus ? `<div class="note gift">🎁 <div>Bonus hisobingizda <b>${fmt(me.bonus)}</b> bor — buyurtmada avtomatik ishlatiladi.</div></div>` : ""}
    <div class="note info">🚚 <div>Ko'p mahsulot olsangiz, yetkazib berish arzonlashadi yoki <b>bepul</b> bo'ladi.</div></div>`;
}
function changeQty(id, d){
  const p = byId(id); if (!p) return;
  const q = (cart[id] || 0) + d;
  if (q > p.stock){ toast(`Omborda faqat ${p.stock} ta bor`); notifyH("warning"); return; }
  setQty(id, q); haptic();
}
function setQty(id, q){
  if (q <= 0) delete cart[id]; else cart[id] = q;
  saveCart(); refreshCtl(id); updateBadge();
  if (view === "cart") renderCart();
  if (view === "checkout") requestQuote();
  syncMain();
}
function updateBadge(){ const t = totals(); $("nb").style.display = t.count ? "flex" : "none"; $("nb").textContent = t.count; }

/* ============ rasmiylashtirish ============ */
let map = null, locChosen = !!lastLoc, mapMovedByUser = false;
function renderCheckout(){
  if (!inTg && !(typeof DEMO !== "undefined" && DEMO)){
    $("v-checkout").innerHTML = `<div class="empty"><div class="e">📱</div><p>Buyurtma berish uchun do'konni Telegram'dagi bot ichida oching.</p><button class="btn soft" data-go="cart">Savatga qaytish</button></div>`;
    return;
  }
  const places = (me && me.places) || [];
  if (co.mode === "place" && !places.length) co.mode = "map";
  const groups = [...new Set(places.map(p => p.grp))];
  const yellow = me && me.yellow;
  if (yellow) co.pay = "transfer";
  $("v-checkout").innerHTML = `
    <div class="ptitle"><button class="bk" data-go="cart" aria-label="Orqaga">${I.back}</button>Rasmiylashtirish</div><div class="hr"></div>
    <div class="blk">
      <h3>Yetkazib berish manzili</h3>
      <div class="seg" id="seg">
        <button data-mode="map" class="${co.mode==="map"?"on":""}">Xaritada</button>
        ${places.length ? `<button data-mode="place" class="${co.mode==="place"?"on":""}">Mo'ljal</button>` : ""}
        <button data-mode="link" class="${co.mode==="link"?"on":""}">Havola</button>
      </div>
      <div id="m-map" class="${co.mode==="map"?"":"hide"}">
        <div class="mapwrap">
          <div id="map"></div>
          <div class="pinshadow"></div>
          <div class="pin" id="pin"><svg width="38" height="48" viewBox="0 0 38 48"><path d="M19 47s17-16.6 17-28A17 17 0 0 0 2 19c0 11.4 17 28 17 28z" fill="var(--brand)"/><circle cx="19" cy="18" r="7" fill="#fff"/></svg></div>
          <div class="maphint ${locChosen?"hide":""}" id="maphint"><span>Xaritani suring — belgi uyingizga tushsin</span></div>
          <button class="locbtn" data-a="geo" type="button">🎯 Joylashuvim</button>
        </div>
      </div>
      <div id="m-place" class="${co.mode==="place"?"":"hide"}">
        <label class="field"><small>Hudud</small><select id="grp"><option value="">Tanlang</option>${groups.map(g => `<option ${co.grp===g?"selected":""}>${esc(g)}</option>`).join("")}</select></label>
        <label class="field"><small>Mo'ljal</small><select id="plc"></select></label>
      </div>
      <div id="m-link" class="${co.mode==="link"?"":"hide"}">
        <label class="field"><small>Yandex / Google / 2GIS havolasi yoki koordinata</small><input id="lnk" placeholder="https://yandex.uz/maps/?pt=…" value="${esc(co.link||"")}"></label>
      </div>
      <label class="field" style="margin-bottom:0"><small>Uy, podyezd, qavat, xonadon</small><input id="addr" placeholder="Masalan: 12-uy, 2-podyezd, 3-qavat" value="${esc(co.addr)}" maxlength="200"></label>
    </div>
    <div class="blk">
      <h3>Aloqa</h3>
      <div class="inl">
        <label class="field"><small>Telefon raqam</small><input id="phone" type="tel" inputmode="tel" value="${esc(co.phone || (me && me.phone) || "+998 ")}" maxlength="20"></label>
        ${ver("6.9") ? `<button class="btn soft" data-a="contact" type="button">📱 Telegram<br>raqamim</button>` : ""}
      </div>
      <label class="field" style="margin:12px 0 0"><small>Kuryerga izoh (ixtiyoriy)</small><input id="note" value="${esc(co.note)}" placeholder="Masalan: qo'ng'iroq qilmang, yozing" maxlength="200"></label>
    </div>
    <div class="blk">
      <h3>To'lov usuli</h3>
      ${yellow ? `<div class="note warn" style="margin:0 0 12px">⚠️ <div>Hisobingiz uchun hozircha faqat <b>oldindan to'lov</b> mavjud${me.yellow_left ? ` (yana ${me.yellow_left} ta buyurtma)` : ""}.</div></div>` : ""}
      <div class="pay">
        <button data-pay="cash" class="${co.pay==="cash"?"on":""}" ${yellow?"disabled":""}><span class="ic">💵</span><div><b>Naqd</b><small>Mahsulotni olganingizda kuryerga</small></div></button>
        <button data-pay="transfer" class="${co.pay==="transfer"?"on":""}"><span class="ic">💳</span><div><b>Pul o'tkazish</b><small>${me && me.auto_pay ? "Click / Payme orqali" : "Kartaga o'tkazib, chekni yuborasiz"}</small></div></button>
      </div>
      ${yellow ? "" : `<div class="muted small" style="margin-top:10px">Yakuniy to'lov usulini mahsulotni qabul qilganda ham tanlashingiz mumkin.</div>`}
    </div>
    <div class="sum" id="qbox"></div>`;
  fillPlaces(); renderQuote();
  if (co.mode === "map") initMap();
  requestQuote();
}
function fillPlaces(){
  const sel = $("plc"); if (!sel || !me) return;
  const g = $("grp").value;
  const list = me.places.filter(p => p.grp === g);
  sel.innerHTML = `<option value="">${g ? "Tanlang" : "Avval hududni tanlang"}</option>` +
    list.map(p => `<option value="${p.id}" ${+co.place===p.id?"selected":""}>${esc(p.name)}</option>`).join("");
}
function initMap(){
  if (!window.L){ const w = $("m-map").querySelector(".mapwrap"); if (w) w.innerHTML = `<div class="empty" style="padding:30px 12px">Xarita yuklanmadi.<br>«Havola» yoki «Mo'ljal» orqali tanlang.</div>`; return; }
  const c = lastLoc ? [lastLoc.lat, lastLoc.lon] : (me ? me.center : [41.12, 72.07]);
  if (map){ map.remove(); map = null; }
  map = L.map("map", {zoomControl:false, attributionControl:true}).setView(c, lastLoc ? 17 : 14);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:"© OpenStreetMap"}).addTo(map);
  map.on("dragstart zoomstart", () => { mapMovedByUser = true; $("pin").classList.add("up"); });
  map.on("moveend", () => {
    $("pin").classList.remove("up");
    if (!mapMovedByUser) return;
    mapMovedByUser = false; setPoint(map.getCenter().lat, map.getCenter().lng, false);
  });
  setTimeout(() => map && map.invalidateSize(), 200);
}
function setPoint(lat, lon, fly){
  lastLoc = {lat:+lat.toFixed(6), lon:+lon.toFixed(6)}; store.set("mg_loc", lastLoc);
  locChosen = true; const h = $("maphint"); if (h) h.classList.add("hide");
  if (fly && map) map.setView([lat, lon], 17);
  requestQuote();
}
function geolocate(){
  const ok = pos => { setPoint(pos.lat, pos.lon, true); notifyH("success"); };
  const fail = msg => toast(msg || "Joylashuvni aniqlab bo'lmadi — xaritani o'zingiz suring");
  if (inTg && ver("8.0") && tg.LocationManager){
    const lm = tg.LocationManager;
    const get = () => lm.getLocation(d => {
      if (d) ok({lat:d.latitude, lon:d.longitude});
      else if (lm.isLocationAvailable && !lm.isAccessGranted && lm.isAccessRequested) { fail("Joylashuvga ruxsat berilmagan"); try { lm.openSettings(); } catch(e){} }
      else fail();
    });
    if (lm.isInited) get(); else lm.init(get);
    return;
  }
  if (!navigator.geolocation) return fail();
  navigator.geolocation.getCurrentPosition(p => ok({lat:p.coords.latitude, lon:p.coords.longitude}), () => fail(), {enableHighAccuracy:true, timeout:12000});
}
function locPayload(){
  if (co.mode === "map") return locChosen && lastLoc ? {type:"point", lat:lastLoc.lat, lon:lastLoc.lon} : null;
  if (co.mode === "place") return co.place ? {type:"place", id:+co.place} : null;
  if (co.mode === "link") return (co.link||"").trim().length > 5 ? {type:"link", text:co.link.trim()} : null;
  return null;
}
const orderBody = () => ({
  items: cartItems().map(([p, q]) => ({id:p.id, qty:q})),
  loc: locPayload(), address: co.addr, note: co.note, phone: co.phone || (me && me.phone) || "", pay: co.pay
});
let qTimer;
function requestQuote(){
  clearTimeout(qTimer);
  qTimer = setTimeout(async () => {
    if (view !== "checkout") return;
    const body = orderBody();
    if (!body.items.length){ go("cart"); return; }
    if (!body.loc){ quote = null; quoteErr = ""; renderQuote(); return; }
    const seq = ++quoteSeq;
    try { const q = await api("quote", body); if (seq !== quoteSeq) return; quote = q; quoteErr = ""; }
    catch(e){ if (seq !== quoteSeq) return; quote = null; quoteErr = e.message; }
    renderQuote();
  }, 350);
}
function renderQuote(){
  const box = $("qbox"); if (!box) return;
  const t = totals();
  if (!quote){
    box.innerHTML = `<div><span>Mahsulotlar (${t.count} ta)</span><b>${fmt(t.sum)}</b></div>
      <div><span>Yetkazib berish</span><b class="muted" style="font-weight:500">${locPayload() ? "hisoblanmoqda…" : "manzilni tanlang"}</b></div>
      ${quoteErr ? `<div class="err" style="border:0">${esc(quoteErr)}</div>` : ""}`;
  } else {
    box.innerHTML = `<div><span>Mahsulotlar (${t.count} ta)</span><b>${fmt(quote.items_total)}</b></div>
      <div class="${quote.delivery ? "" : "g"}"><span>Yetkazib berish · ${quote.km} km</span><b>${quote.delivery ? fmt(quote.delivery) : "Bepul"}</b></div>
      ${quote.bonus_used ? `<div class="g"><span>Bonus hisobidan</span><b>−${fmt(quote.bonus_used)}</b></div>` : ""}
      <div class="t"><span>Jami</span><b>${fmt(quote.total)}</b></div>
      ${quote.excess ? `<div class="note gift" style="border:0;padding:13px 15px;font-size:14px">🎁 <div>Buyurtma yetkazilgach hisobingizga <b>${fmt(quote.excess)}</b> bonus tushadi.</div></div>` : ""}`;
  }
  syncMain();
}
async function submit(){
  if (busy) return;
  co.phone = ($("phone") && $("phone").value.trim()) || co.phone; saveCo();
  const body = orderBody();
  if (!body.loc){ toast("Avval manzilni tanlang"); notifyH("error"); return; }
  if (body.phone.replace(/\D/g, "").length < 9){ toast("Telefon raqamni to'liq kiriting"); $("phone").focus(); notifyH("error"); return; }
  if (!quote){ toast(quoteErr || "Narx hisoblanmoqda, biroz kuting"); return; }
  busy = true; syncMain();
  try {
    const res = await api("order", body);
    notifyH("success");
    cart = {}; saveCart(); updateBadge();
    if (me && quote.bonus_used) me.bonus = Math.max(0, me.bonus - quote.bonus_used);
    showDone(res);
  } catch(e){ toast(e.message); notifyH("error"); }
  finally { busy = false; syncMain(); }
}
function showDone(res){
  const conf = [["#53b175",14,"8%","10%"],["#f3603f",8,"86%","4%"],["#f8a44c",10,"2%","62%"],["#5b8def",12,"90%","70%"],["#d3b0e0",9,"20%","92%"],["var(--brand-2)",11,"72%","94%"]]
    .map(([c,s,x,y]) => `<i style="background:${c};width:${s}px;height:${s}px;left:${x};top:${y}"></i>`).join("");
  const check = `<div class="ok">${conf}<div class="c"><svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div></div>`;
  let body = "";
  if (res.next === "receipt"){
    body = `<p>Jami <b>${fmt(res.total)}</b> ni quyidagi kartaga o'tkazing va chek rasmini botga yuboring.</p>
      <div class="cardnum"><span id="cardn">${esc(res.card)}</span><button data-a="copy">Nusxa</button></div>`;
  } else if (res.next === "invoice"){
    body = `<p>To'lov tugmasini botga yubordik. To'lov o'tishi bilan buyurtma yo'lga chiqadi.</p>`;
  } else {
    body = `<p>Buyurtma #${res.id} · Jami ${fmt(res.total)}.<br>Kuryer topilishi bilan botda xabar beramiz.</p>`;
  }
  $("v-done").innerHTML = `<div class="done">${check}<h2>Buyurtmangiz<br>qabul qilindi</h2>${body}
    <div style="display:grid;gap:6px">
      <button class="btn block" data-go="orders">Buyurtmani kuzatish</button>
      ${inTg ? `<button class="btn ghost block" data-a="tochat">Botga o'tish</button>` : `<button class="btn ghost block" data-go="catalog">Bosh sahifaga</button>`}
    </div></div>`;
  go("done");
}

/* ============ buyurtmalar ============ */
async function renderOrders(){
  const v = $("v-orders");
  const head = `<div class="ptitle">Buyurtmalar</div><div class="hr"></div>`;
  if (!inTg && !(typeof DEMO !== "undefined" && DEMO)){ v.innerHTML = head + `<div class="empty"><div class="e">📱</div><p>Buyurtmalaringizni ko'rish uchun do'konni Telegram'dagi bot ichida oching.</p></div>`; return; }
  v.innerHTML = head + `<div class="skel" style="height:120px;margin-top:20px"></div>`;
  try {
    const {orders} = await api("orders");
    const bonus = me && me.bonus ? `<div class="note gift">🎁 <div>Bonus hisobingiz: <b>${fmt(me.bonus)}</b></div></div>` : "";
    v.innerHTML = head + bonus + (orders.length ? orders.map(o => `
      <div class="ord">
        <div class="oh"><b>#${o.id}</b><span class="st ${o.color}">${esc(o.status)}</span></div>
        <ul>${o.items.map(i => `<li><span>${esc(i.name)} ×&nbsp;${i.qty}</span><span>${fmt(i.price*i.qty)}</span></li>`).join("")}</ul>
        <div class="of"><span class="muted">${new Date(o.created*1000).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})} · ${esc(o.pay)}</span><b>${fmt(o.total)}</b></div>
      </div>`).join("") : `<div class="empty"><div class="e">🧾</div><p>Hali buyurtma bermagansiz</p><button class="btn" data-go="catalog">Xarid qilish</button></div>`);
  } catch(e){ v.innerHTML = head + `<div class="empty"><div class="e">😕</div><p>${esc(e.message)}</p><button class="btn soft" data-go="orders">Qayta urinish</button></div>`; }
}

/* ============ navigatsiya va asosiy tugma ============ */
let mainFn = null;
function setMain(text, fn){
  mainFn = fn;
  if (inTg){
    const mb = tg.MainButton;
    if (!text){ mb.hide(); return; }
    mb.setParams({text, color:getComputedStyle(document.documentElement).getPropertyValue("--brand").trim() || "#d82c90", text_color:"#ffffff", is_active:!busy, is_visible:true});
    busy ? mb.showProgress(false) : mb.hideProgress();
  } else {
    const f = $("fab"); f.style.display = text ? "block" : "none"; f.textContent = busy ? "Yuborilmoqda…" : text; f.disabled = busy;
  }
}
if (inTg) tg.MainButton.onClick(() => mainFn && !busy && mainFn());
$("fab").onclick = () => mainFn && !busy && mainFn();
function syncMain(){
  const t = totals();
  if (sheetId){ setMain("", null); return; }
  if (view === "catalog" || view === "category" || view === "explore") setMain(t.count ? `Savatga o'tish · ${fmt(t.sum)}` : "", () => go("cart"));
  else if (view === "cart") setMain(t.count ? `Rasmiylashtirish · ${fmt(t.sum)}` : "", () => go("checkout"));
  else if (view === "checkout" && (inTg || (typeof DEMO !== "undefined" && DEMO))) setMain(busy ? "Yuborilmoqda…" : quote ? `Buyurtma berish · ${fmt(quote.total)}` : "Buyurtma berish", submit);
  else setMain("", null);
}
function syncBack(){
  if (!inTg) return;
  (sheetId || view !== "catalog") ? tg.BackButton.show() : tg.BackButton.hide();
}
if (inTg) tg.BackButton.onClick(() => {
  if (sheetId) return closeSheet();
  if (view === "checkout") return go("cart");
  if (view === "category") return catBack();
  go("catalog");
});
function catBack(){ if (path.length > 1){ path.pop(); renderCategory(); } else go(catFrom); }
function go(v){
  if (sheetId) closeSheet();
  if (view === "checkout" && map){ map.remove(); map = null; }
  view = v;
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("on", s.id === "v-" + v));
  const navKey = v === "category" ? (catFrom === "explore" ? "explore" : "catalog") : v;
  document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("on", b.dataset.go === navKey));
  const nonav = v === "checkout" || v === "done";
  $("nav").classList.toggle("hide", nonav); document.body.classList.toggle("nonav", nonav);
  if (v === "catalog") renderHome();
  if (v === "explore") renderExplore();
  if (v === "category") renderCategory();
  if (v === "cart") renderCart();
  if (v === "checkout"){ quote = null; quoteErr = ""; renderCheckout(); }
  if (v === "orders") renderOrders();
  window.scrollTo(0, 0);
  syncBack(); syncMain();
}

/* ============ hodisalar ============ */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a],[data-go],[data-cat],[data-mode],[data-pay]");
  if (!el) return;
  const d = el.dataset;
  if (d.go){ go(d.go); return; }
  if (d.cat !== undefined){
    const id = +d.cat; haptic("soft");
    if (view === "category" && d.lvl !== undefined){ path = path.slice(0, +d.lvl); if (!path.length || path[path.length-1] !== id) path.push(id); renderCategory(); window.scrollTo(0,0); }
    else openCat(id);
    return;
  }
  if (d.mode){
    co.mode = d.mode; saveCo(); haptic("soft");
    document.querySelectorAll("#seg button").forEach(b => b.classList.toggle("on", b === el));
    ["map","place","link"].forEach(m => { const x = $("m-"+m); if (x) x.classList.toggle("hide", m !== co.mode); });
    if (co.mode === "map") initMap();
    quote = null; requestQuote(); renderQuote(); return;
  }
  if (d.pay){
    if (el.disabled) return;
    co.pay = d.pay; saveCo(); haptic("soft");
    document.querySelectorAll("[data-pay]").forEach(b => b.classList.toggle("on", b === el)); return;
  }
  const a = d.a, id = d.id;
  if (a === "inc") changeQty(id, 1);
  else if (a === "dec") changeQty(id, -1);
  else if (a === "rm"){ setQty(id, 0); haptic(); }
  else if (a === "open") openSheet(id);
  else if (a === "close") closeSheet();
  else if (a === "catback") catBack();
  else if (a === "tosale"){ const s = $("saleSec"); if (s) s.scrollIntoView({behavior:"smooth"}); }
  else if (a === "sinc" || a === "sdec"){
    const p = byId(sheetId); sheetQty = Math.max(1, Math.min(p.stock, sheetQty + (a === "sinc" ? 1 : -1))); haptic(); renderSheet();
  }
  else if (a === "sadd"){
    const p = byId(sheetId); const was = cart[p.id] || 0;
    if (was === sheetQty){ go("cart"); return; }
    setQty(p.id, sheetQty); notifyH("success");
    toast(was ? "Savat yangilandi" : "Savatga qo'shildi"); closeSheet();
  }
  else if (a === "geo") geolocate();
  else if (a === "contact"){
    tg.requestContact((ok, r) => {
      const ph = ok && r && r.responseUnsafe && r.responseUnsafe.contact && r.responseUnsafe.contact.phone_number;
      if (ph){ const v = (ph.startsWith("+") ? "" : "+") + ph; $("phone").value = v; co.phone = v; saveCo(); notifyH("success"); }
    });
  }
  else if (a === "copy"){
    const txt = $("cardn").textContent.replace(/\s/g, "");
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast("Karta raqami nusxalandi"), () => toast(txt));
  }
  else if (a === "tochat"){ try { tg.close(); } catch(e){} }
});
$("sbg").onclick = closeSheet;
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "q"){ query = t.value.trim(); $("qx").classList.toggle("hide", !query); renderHome(); return; }
  if (t.id === "addr"){ co.addr = t.value; saveCo(); }
  if (t.id === "note"){ co.note = t.value; saveCo(); }
  if (t.id === "phone"){ co.phone = t.value; saveCo(); }
  if (t.id === "lnk"){ co.link = t.value; saveCo(); requestQuote(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "grp"){ co.grp = t.value; co.place = ""; saveCo(); fillPlaces(); requestQuote(); }
  if (t.id === "plc"){ co.place = t.value; saveCo(); requestQuote(); }
});
$("qx").onclick = () => { $("q").value = ""; query = ""; $("qx").classList.add("hide"); renderHome(); };
$("q").addEventListener("keydown", e => { if (e.key === "Enter") e.target.blur(); });

/* ============ ishga tushirish ============ */
(async function init(){
  try {
    const data = await api("catalog");
    products = data.products; cats = data.categories;
  } catch(e){
    $("home").innerHTML = `<div class="empty"><div class="e">😕</div><p>Mahsulotlarni yuklab bo'lmadi</p><button class="btn soft" onclick="location.reload()">Qayta urinish</button></div>`;
    return;
  }
  for (const id of Object.keys(cart)){ const p = byId(id); if (!p) delete cart[id]; else if (cart[id] > p.stock) cart[id] = p.stock; }
  saveCart();
  renderHome(); updateBadge(); syncMain();
  if (inTg || (typeof DEMO !== "undefined" && DEMO)){
    try {
      me = await api("me");
      if (me.bonus) $("loc").innerHTML = `🎁 <span>Bonus hisobingiz: <b>${fmt(me.bonus)}</b></span>`;
    } catch(e){}
  }
})();
</script>
</body>
</html>
