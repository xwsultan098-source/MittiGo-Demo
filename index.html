<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --brand:#d82c90;          /* Mitti Go pushti — asosiy rang */
  --brand-2:#00acee;        /* Mitti Go havorang */
  --navy:#293897;           /* Mitti Go to'q ko'k */
  --on-brand:#fff;
  --sale:#f04423;
  --ok:#16a34a; --amber:#d97706; --red:#e11d48;
  --bg:var(--tg-theme-secondary-bg-color,#f2f4f7);
  --card:var(--tg-theme-section-bg-color,var(--tg-theme-bg-color,#fff));
  --text:var(--tg-theme-text-color,#111827);
  --hint:var(--tg-theme-hint-color,#8b93a1);
  --soft:color-mix(in srgb,var(--text) 6%,transparent);
  --line:color-mix(in srgb,var(--text) 10%,transparent);
  --brand-soft:color-mix(in srgb,var(--brand) 14%,transparent);
  --r:18px; --r-sm:12px;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.05);
}
@media (prefers-color-scheme:dark){
  :root:not(.tg){--bg:#0f1115;--card:#1a1d24;--text:#eef0f4;--hint:#8b93a1;--shadow:none}
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
img{display:block}
.hide{display:none!important}
.muted{color:var(--hint)}
.small{font-size:13px}

/* ── header ── */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 16px 4px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.logo{display:block;height:38px;width:auto}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--card);font-size:13px;font-weight:600;box-shadow:var(--shadow)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:0 12px;height:44px;box-shadow:var(--shadow)}
.search svg{flex:none;opacity:.5}
.search input{flex:1;border:0;outline:0;background:none;height:100%;min-width:0}
.search .x{color:var(--hint);font-size:20px;line-height:1;padding:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);font-size:14px;font-weight:500;white-space:nowrap;box-shadow:var(--shadow);transition:background .15s,color .15s}
.chip.on{background:var(--navy);color:#fff}
.chips.sub{padding-top:6px}
.chips.sub .chip{padding:6px 12px;font-size:13px;background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.chips.sub .chip.on{background:var(--brand-soft);color:var(--brand);box-shadow:inset 0 0 0 1px transparent;font-weight:600}

/* ── layout ── */
.view{display:none;padding:8px 16px 16px}
.view.on{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.h{display:flex;align-items:baseline;justify-content:space-between;margin:14px 2px 10px}
.h h2{font-size:19px;font-weight:800;letter-spacing:-.2px}
.h span{color:var(--hint);font-size:13px}
.title{font-size:24px;font-weight:800;letter-spacing:-.4px;margin:8px 2px 14px}

/* ── product cards ── */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.rail{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 6px;scroll-snap-type:x mandatory;scroll-padding:0 16px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .card{flex:0 0 46%;max-width:200px;scroll-snap-align:start}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);position:relative}
.ph{position:relative;aspect-ratio:1/1;background:#fff;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .25s}
.ph img.ld{opacity:1}
.ph .ini{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-weight:800;color:color-mix(in srgb,var(--brand) 55%,#fff);background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 10%,#fff),color-mix(in srgb,var(--brand) 22%,#fff))}
.badge{position:absolute;top:8px;left:8px;background:var(--sale);color:#fff;font-size:12px;font-weight:800;padding:3px 8px;border-radius:8px;z-index:1}
.left{position:absolute;bottom:8px;left:8px;background:rgba(17,24,39,.72);color:#fff;font-size:11px;font-weight:600;padding:3px 8px;border-radius:8px;z-index:1}
.cb{padding:10px 10px 10px;display:flex;flex-direction:column;gap:6px;flex:1}
.price{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.price b{font-size:16px;font-weight:800;letter-spacing:-.2px}
.price b.s{color:var(--sale)}
.price s{color:var(--hint);font-size:12px}
.nm{font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.add{margin-top:auto;height:38px;border-radius:12px;background:var(--brand-soft);color:var(--brand);font-weight:700;width:100%;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .1s}
.add:active{transform:scale(.97)}
.step{margin-top:auto;display:flex;align-items:center;justify-content:space-between;height:38px;border-radius:12px;background:var(--brand);color:var(--on-brand)}
.step button{width:42px;height:100%;font-size:21px;font-weight:600;color:inherit;display:grid;place-items:center}
.step button:disabled{opacity:.35}
.step b{font-size:15px}
.empty{text-align:center;color:var(--hint);padding:56px 20px}
.empty .e{font-size:48px;margin-bottom:10px}
.empty p{margin-bottom:16px}
.btn{height:46px;padding:0 20px;border-radius:14px;background:var(--brand);color:var(--on-brand);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--soft);color:var(--text)}
.btn.block{width:100%}
.skel{background:linear-gradient(90deg,var(--soft) 25%,color-mix(in srgb,var(--text) 10%,transparent) 50%,var(--soft) 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--r)}
@keyframes sk{to{background-position:-200% 0}}

/* ── bottom nav ── */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--hint);padding:5px 0;position:relative}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--brand)}
.top::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--brand),var(--navy),var(--brand-2))}
.nb{position:absolute;top:0;left:calc(50% + 5px);background:var(--sale);color:#fff;font-size:11px;font-weight:800;min-width:18px;height:18px;border-radius:9px;padding:0 5px;display:none;align-items:center;justify-content:center;border:2px solid var(--card)}

/* ── cart / lists ── */
.box{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:12px}
.box.pad{padding:14px 16px}
.box h3{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.row{display:flex;gap:12px;align-items:center;padding:12px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .ph{width:68px;height:68px;flex:none;border-radius:12px;aspect-ratio:auto}
.row .ph .ini{font-size:22px}
.row .left{display:none}
.row .badge{top:4px;left:4px;font-size:10px;padding:2px 5px;border-radius:6px}
.row .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.row .mid .nm{min-height:0;font-size:14px}
.row .step{width:104px;height:34px;flex:none;margin:0;background:var(--soft);color:var(--text)}
.row .step button{width:34px;font-size:19px}
.sum>div{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.sum .t{font-weight:800;font-size:18px;border-top:1px dashed var(--line);margin-top:8px;padding-top:12px}
.sum .g{color:var(--ok)}
.note{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:14px;font-size:13px;line-height:1.4;margin-bottom:12px}
.note.info{background:var(--brand-soft)}
.note.warn{background:color-mix(in srgb,var(--amber) 15%,transparent)}
.note.gift{background:color-mix(in srgb,var(--ok) 13%,transparent)}

/* ── checkout ── */
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;height:34px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--hint)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.mapwrap{position:relative;height:230px;border-radius:14px;overflow:hidden;background:var(--soft);margin-bottom:10px}
#map{position:absolute;inset:0}
.pin{position:absolute;left:50%;top:50%;z-index:500;transform:translate(-50%,-100%);pointer-events:none;transition:transform .15s}
.pin.up{transform:translate(-50%,-118%)}
.pin svg{filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.pinshadow{position:absolute;left:50%;top:50%;width:10px;height:4px;margin:-2px 0 0 -5px;border-radius:50%;background:rgba(0,0,0,.3);z-index:499;pointer-events:none}
.locbtn{position:absolute;right:10px;bottom:10px;z-index:600;height:38px;padding:0 13px;border-radius:12px;background:var(--card);font-weight:600;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.18);display:flex;align-items:center;gap:6px}
.maphint{position:absolute;left:10px;top:10px;right:10px;z-index:600;text-align:center;pointer-events:none}
.maphint span{display:inline-block;background:rgba(17,24,39,.78);color:#fff;font-size:12px;padding:5px 10px;border-radius:999px}
.field{display:block;background:var(--soft);border-radius:12px;padding:8px 12px;margin-bottom:10px}
.field small{display:block;color:var(--hint);font-size:12px;margin-bottom:2px}
.field input,.field textarea,.field select{width:100%;border:0;outline:0;background:none;resize:none;padding:2px 0}
.field select{appearance:none;-webkit-appearance:none}
.inl{display:flex;gap:8px;align-items:stretch}
.inl .field{flex:1;margin:0}
.inl .btn{height:auto;padding:0 12px;font-size:13px;border-radius:12px}
.pay{display:grid;gap:8px}
.pay button{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:14px;background:var(--soft);border:2px solid transparent}
.pay button.on{border-color:var(--brand);background:var(--brand-soft)}
.pay button:disabled{opacity:.45}
.pay .ic{font-size:22px}
.pay b{display:block;font-size:14.5px}
.pay small{color:var(--hint);font-size:12.5px}
.err{color:var(--red);font-size:13px;margin:4px 2px 0;min-height:0}

/* ── orders ── */
.ord{padding:14px 16px}
.ord .oh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.ord .oh b{font-size:16px}
.st{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.st.blue{background:var(--brand-soft);color:var(--brand)}
.st.green{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.st.amber{background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber)}
.st.red{background:color-mix(in srgb,var(--red) 13%,transparent);color:var(--red)}
.ord ul{list-style:none;font-size:13.5px;color:var(--hint);margin-bottom:8px}
.ord li{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.ord li span:first-child{flex:1;min-width:0}
.ord li span:last-child{white-space:nowrap}
.ord .of{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:9px;font-size:14px}

/* ── success ── */
.done{text-align:center;padding:36px 8px 10px}
.done .ok{width:84px;height:84px;border-radius:50%;margin:0 auto 18px;background:color-mix(in srgb,var(--ok) 15%,transparent);display:grid;place-items:center;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.done h2{font-size:22px;margin-bottom:6px}
.done p{color:var(--hint);margin-bottom:18px}
.cardnum{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--soft);border-radius:14px;padding:14px 16px;font-size:18px;font-weight:700;letter-spacing:1px;margin:0 0 12px}
.cardnum button{font-size:13px;font-weight:700;color:var(--brand);letter-spacing:0}

/* ── sheet ── */
.sbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.sbg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:24px 24px 0 0;max-height:92vh;overflow:auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;position:absolute;left:0;right:0;top:0;z-index:2}
.sheet .ph{aspect-ratio:auto;height:min(52vh,380px)}
.sheet .ph .ini{font-size:72px}
.sheet .in{padding:16px 18px 4px}
.sheet .path{color:var(--hint);font-size:12.5px;margin-bottom:4px}
.sheet h3{font-size:20px;line-height:1.25;margin-bottom:10px;letter-spacing:-.2px}
.sheet .price b{font-size:24px}
.sheet .price s{font-size:15px}
.sheet .desc{color:var(--text);opacity:.85;margin:12px 0 4px;white-space:pre-line;font-size:14.5px}
.sheet .meta{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 14px}
.sheet .meta span{background:var(--soft);border-radius:10px;padding:6px 10px;font-size:12.5px;color:var(--hint)}
.sheet .add,.sheet .step{height:50px;font-size:16px;border-radius:14px}
.sheet .add{background:var(--brand);color:var(--on-brand)}
.sheet .step button{width:60px;font-size:24px}
.sheet .x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:17px;background:rgba(17,24,39,.55);color:#fff;font-size:18px;z-index:3;display:grid;place-items:center}

.fab{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:35;height:52px;border-radius:16px;background:var(--brand);color:var(--on-brand);font-weight:800;font-size:16px;display:none;box-shadow:0 8px 24px color-mix(in srgb,var(--brand) 40%,transparent)}
.fab:disabled{opacity:.6}
body.nonav .fab{bottom:calc(16px + env(safe-area-inset-bottom))}
body.nonav{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-150%);z-index:60;background:rgba(17,24,39,.92);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);transition:transform .25s;text-align:center}
.toast.on{transform:translate(-50%,0)}
.leaflet-control-attribution{font-size:9px!important}
</style>
</head>

    const q=demoQuote(body); const list=store.get("demo_orders",[]); const id=1000+list.length+1;
    for(const it of q.items){const p=DEMO_DATA.products.find(x=>x.id===it.id); p.stock-=it.qty;}
    DEMO_ME.bonus-=q.bonus_used;
    list.unshift({id,status:"Kuryer izlanmoqda",color:"blue",created:Math.floor(Date.now()/1000),total:q.total,delivery:q.delivery,pay:body.pay==="cash"?"Naqd":"Pul o'tkazish",items:q.items});
    store.set("demo_orders",list);
    return {ok:true,id,total:q.total,next:"done"};
  }
  if(path==="orders") return {orders:store.get("demo_orders",[])};
  throw new Error("?");
}

/* ============ state ============ */
let products = [], cats = [], me = null;
let path = [], query = "", view = "catalog";
let cart = store.get("mg_cart", {});                  // {productId: qty}
let co = store.get("mg_co", {mode:"map", pay:"cash", addr:"", note:"", phone:""});   // checkout tanlovlari
let lastLoc = store.get("mg_loc", null);               // {lat, lon}
let quote = null, quoteErr = "", quoteSeq = 0, busy = false;
const byId = id => products.find(p => p.id === +id);
const catById = id => cats.find(c => c.id === id);
const kids = id => cats.filter(c => c.parent === id);
const saveCart = () => store.set("mg_cart", cart);
const saveCo = () => store.set("mg_co", co);

function descOf(catId){                                  // kategoriya + barcha ichkilari
  const out = new Set([catId]); let grow = true;
  while (grow){ grow = false; for (const c of cats) if (out.has(c.parent) && !out.has(c.id)){ out.add(c.id); grow = true; } }
  return out;
}
function catPath(id){ const a = []; while (id){ const c = catById(id); if (!c) break; a.unshift(c.name); id = c.parent; } return a.join(" › "); }
const pct = p => p.old_price > p.price ? Math.round(100 - p.price*100/p.old_price) : 0;
function totals(){
  let count = 0, sum = 0;
  for (const [id, q] of Object.entries(cart)){ const p = byId(id); if (p){ count += q; sum += p.price*q; } }
  return {count, sum};
}

/* ============ rendering: catalog ============ */
function photo(p, cls="ph"){
  const ini = esc((p.name||"?").trim().charAt(0).toUpperCase());
  return `<div class="${cls}">
    ${pct(p) ? `<span class="badge">−${pct(p)}%</span>` : ""}
    ${p.stock <= 5 ? `<span class="left">Qoldi ${p.stock} ta</span>` : ""}
    ${p.photo ? `<img src="${esc(p.photo)}" loading="lazy" alt="" onload="this.classList.add('ld')" onerror="this.remove()">` : ""}
    ${p.photo ? "" : `<div class="ini">${ini}</div>`}
  </div>`;
}
function priceHtml(p){
  return `<div class="price"><b class="${pct(p) ? "s" : ""}">${fmt(p.price)}</b>${pct(p) ? `<s>${fmt(p.old_price)}</s>` : ""}</div>`;
}
function ctrl(p){
  const q = cart[p.id] || 0;
  if (!q) return `<button class="add" data-a="inc" data-id="${p.id}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Savatga</button>`;
  return `<div class="step"><button data-a="dec" data-id="${p.id}" aria-label="Kamaytirish">−</button><b>${q}</b><button data-a="inc" data-id="${p.id}" ${q >= p.stock ? "disabled" : ""} aria-label="Ko'paytirish">+</button></div>`;
}
const cardHtml = p => `<div class="card">
  <div data-a="open" data-id="${p.id}">${photo(p)}</div>
  <div class="cb">${priceHtml(p)}<div class="nm" data-a="open" data-id="${p.id}">${esc(p.name)}</div><div class="ctl" data-ctl="${p.id}">${ctrl(p)}</div></div>
</div>`;

function renderChips(){
  const top = kids(0);
  $("chips").innerHTML = `<button class="chip ${path.length ? "" : "on"}" data-cat="0">Hammasi</button>` +
    top.map(c => `<button class="chip ${path[0] === c.id ? "on" : ""}" data-cat="${c.id}" data-lvl="0">${esc(c.name)}</button>`).join("");
  const sub = $("subchips");
  if (!path.length){ sub.classList.add("hide"); return; }
  const last = path[path.length-1], lk = kids(last);
  let parent, list, sel;
  if (lk.length){ parent = last; list = lk; sel = null; }
  else if (path.length > 1){ parent = path[path.length-2]; list = kids(parent); sel = last; }
  else { sub.classList.add("hide"); return; }
  const lvl = path.indexOf(parent) + 1;
  const back = lvl > 1 ? `<button class="chip" data-back="1">‹ ${esc(catById(parent).name)}</button>` : "";
  sub.innerHTML = back + list.map(c => `<button class="chip ${sel === c.id ? "on" : ""}" data-cat="${c.id}" data-lvl="${lvl}">${esc(c.name)}</button>`).join("");
  sub.classList.remove("hide");
}
function visible(){
  const ql = query.toLowerCase();
  if (ql) return products.filter(p => p.name.toLowerCase().includes(ql) || catPath(p.cat).toLowerCase().includes(ql));
  if (!path.length) return products;
  const ok = descOf(path[path.length-1]);
  return products.filter(p => ok.has(p.cat));
}
function renderCatalog(){
  const list = visible();
  const sale = (!query && !path.length) ? products.filter(p => pct(p)) : [];
  $("saleBlock").classList.toggle("hide", !sale.length);
  $("sale").innerHTML = sale.map(cardHtml).join("");
  $("saleCount").textContent = sale.length ? sale.length + " ta" : "";
  $("gridTitle").textContent = query ? "Qidiruv natijasi" : path.length ? catById(path[path.length-1]).name : "Barcha mahsulotlar";
  $("gridCount").textContent = list.length + " ta";
  $("grid").innerHTML = list.length ? list.map(cardHtml).join("")
    : `<div class="empty" style="grid-column:1/-1"><div class="e">🔎</div><p>Hech narsa topilmadi</p></div>`;
}
function refreshCtl(id){                                // faqat tugmani yangilaymiz — rasm qayta yuklanmaydi
  const p = byId(id); if (!p) return;
  document.querySelectorAll(`[data-ctl="${p.id}"]`).forEach(el => el.innerHTML = ctrl(p));
}

/* ============ cart ============ */
function cartItems(){ return Object.entries(cart).map(([id, q]) => [byId(id), q]).filter(x => x[0]); }
function renderCart(){
  const items = cartItems(), t = totals();
  if (!items.length){
    $("v-cart").innerHTML = `<div class="empty"><div class="e">🛒</div><p>Savatingiz hozircha bo'sh</p><button class="btn" data-go="catalog">Xarid qilish</button></div>`;

  }
  $("v-cart").innerHTML = `<div class="title">Savat</div>

function changeQty(id, d){
  const p = byId(id); if (!p) return;
  const q = (cart[id] || 0) + d;
  if (q > p.stock){ toast(`Omborda faqat ${p.stock} ta bor`); notifyH("warning"); return; }
  if (q <= 0) delete cart[id]; else cart[id] = q;
  haptic(); saveCart();
  refreshCtl(id); updateBadge();
  if (view === "cart") renderCart();

function fillPlaces(){
  const sel = $("plc"); if (!sel || !me) return;

  sel.innerHTML = `<option value="">${g ? "Tanlang" : "Avval hududni tanlang"}</option>` +

}
function initMap(){
  if (!window.L){ $("m-map").querySelector(".mapwrap").innerHTML = `<div class="empty" style="padding:30px 12px">Xarita yuklanmadi.<br>«Havola» yoki «Mo'ljal» orqali tanlang yoki 🎯 tugmasini bosing.</div>`; return; }
  const c = lastLoc ? [lastLoc.lat, lastLoc.lon] : (me ? me.center : [41.12, 72.07]);
  if (map){ map.remove(); map = null; }
  map = L.map("map", {zoomControl:false, attributionControl:true}).setView(c, lastLoc ? 17 : 14);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:"© OpenStreetMap"}).addTo(map);
  map.on("dragstart zoomstart", () => { mapMovedByUser = true; $("pin").classList.add("up"); });
  map.on("moveend", () => {
    $("pin").classList.remove("up");
    if (!mapMovedByUser) return;
    mapMovedByUser = false; setPoint(map.getCenter().lat, map.getCenter().lng, false);
  });
  setTimeout(() => map && map.invalidateSize(), 200);
}
function setPoint(lat, lon, fly){
  lastLoc = {lat:+lat.toFixed(6), lon:+lon.toFixed(6)}; store.set("mg_loc", lastLoc);
  locChosen = true; const h = $("maphint"); if (h) h.classList.add("hide");
  if (fly && map) map.setView([lat, lon], 17);
  requestQuote();
}
function geolocate(){
  const ok = pos => { setPoint(pos.lat, pos.lon, true); notifyH("success"); };
  const fail = msg => toast(msg || "Joylashuvni aniqlab bo'lmadi — xaritani o'zingiz suring");
  if (inTg && ver("8.0") && tg.LocationManager){
    const lm = tg.LocationManager;
    const get = () => lm.getLocation(d => {
      if (d) ok({lat:d.latitude, lon:d.longitude});
      else if (lm.isLocationAvailable && !lm.isAccessGranted && lm.isAccessRequested) { fail("Joylashuvga ruxsat berilmagan"); try { lm.openSettings(); } catch(e){} }
      else fail();
    });
    if (lm.isInited) get(); else lm.init(get);
    return;
  }
  if (!navigator.geolocation) return fail();
  navigator.geolocation.getCurrentPosition(p => ok({lat:p.coords.latitude, lon:p.coords.longitude}), () => fail(), {enableHighAccuracy:true, timeout:12000});
}
function locPayload(){
  if (co.mode === "map") return locChosen && lastLoc ? {type:"point", lat:lastLoc.lat, lon:lastLoc.lon} : null;
  if (co.mode === "place") return co.place ? {type:"place", id:+co.place} : null;
  if (co.mode === "link") return (co.link||"").trim().length > 5 ? {type:"link", text:co.link.trim()} : null;
  return null;
}
const orderBody = () => ({
  items: cartItems().map(([p, q]) => ({id:p.id, qty:q})),
  loc: locPayload(), address: co.addr, note: co.note, phone: co.phone || (me && me.phone) || "", pay: co.pay
});
let qTimer;
function requestQuote(){
  clearTimeout(qTimer);
  qTimer = setTimeout(async () => {
    if (view !== "checkout") return;
    const body = orderBody();
    if (!body.items.length){ go("cart"); return; }
    if (!body.loc){ quote = null; quoteErr = ""; renderQuote(); return; }
    const seq = ++quoteSeq;
    $("qbox") && $("qbox").classList.add("ldg");
    try { const q = await api("quote", body); if (seq !== quoteSeq) return; quote = q; quoteErr = ""; }
    catch(e){ if (seq !== quoteSeq) return; quote = null; quoteErr = e.message; }
    renderQuote();
  }, 350);
}
function renderQuote(){
  const box = $("qbox"); if (!box) return;

    box.innerHTML = `<div><span>Mahsulotlar (${t.count} ta)</span><b>${fmt(quote.items_total)}</b></div>

      ${quote.bonus_used ? `<div class="g"><span>Bonus hisobidan</span><b>−${fmt(quote.bonus_used)}</b></div>` : ""}
      <div class="t"><span>Jami</span><span>${fmt(quote.total)}</span></div>
      ${quote.excess ? `<div class="note gift" style="margin:10px 0 0">🎁 <div>Buyurtma yetkazilgach hisobingizga <b>${fmt(quote.excess)}</b> bonus tushadi.</div></div>` : ""}`;
  }
  syncMain();
}
async function submit(){
  if (busy) return;
  co.phone = ($("phone") && $("phone").value.trim()) || co.phone; saveCo();
  const body = orderBody();
  if (!body.loc){ toast("Avval manzilni tanlang"); notifyH("error"); return; }
  if (body.phone.replace(/\D/g, "").length < 9){ toast("Telefon raqamni to'liq kiriting"); $("phone").focus(); notifyH("error"); return; }
  if (!quote){ toast(quoteErr || "Narx hisoblanmoqda, biroz kuting"); return; }
  busy = true; syncMain();
  try {
    const res = await api("order", body);
    notifyH("success");
    cart = {}; saveCart(); updateBadge(); renderCatalog();
    if (me && quote.bonus_used) me.bonus = Math.max(0, me.bonus - quote.bonus_used);

  finally { busy = false; syncMain(); }
}

        <div class="oh"><b>#${o.id}</b><span class="st ${o.color}">${esc(o.status)}</span></div>
        <ul>${o.items.map(i => `<li><span>${esc(i.name)} ×&nbsp;${i.qty}</span><span>${fmt(i.price*i.qty)}</span></li>`).join("")}</ul>
        <div class="of"><span class="muted">${new Date(o.created*1000).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})} · ${esc(o.pay)}</span><b>${fmt(o.total)}</b></div>
      </div>`).join("") : `<div class="empty"><div class="e">🧾</div><p>Hali buyurtma bermagansiz</p><button class="btn" data-go="catalog">Xarid qilish</button></div>`);
  } catch(e){ v.innerHTML = `<div class="title">Buyurtmalar</div><div class="empty"><div class="e">😕</div><p>${esc(e.message)}</p><button class="btn ghost" data-go="orders">Qayta urinish</button></div>`; }
}

/* ============ navigation & main button ============ */
let mainFn = null, mainText = "";
function setMain(text, fn){
  mainFn = fn; mainText = text;
  if (inTg){
    const mb = tg.MainButton;
    if (!text){ mb.hide(); return; }
    mb.setParams({text, color:getComputedStyle(document.documentElement).getPropertyValue("--brand").trim() || "#d82c90", text_color:"#ffffff", is_active:!busy, is_visible:true});
    busy ? mb.showProgress(false) : mb.hideProgress();
  } else {
    const f = $("fab"); f.style.display = text ? "block" : "none"; f.textContent = busy ? "Yuborilmoqda…" : text; f.disabled = busy;
  }
}
if (inTg) tg.MainButton.onClick(() => mainFn && !busy && mainFn());
$("fab").onclick = () => mainFn && !busy && mainFn();
function syncMain(){
  const t = totals();
  if (sheetId){ const q = cart[sheetId]; setMain(t.count ? `Savatga o'tish · ${fmt(t.sum)}` : "", () => go("cart")); return; }
  if (view === "catalog") setMain(t.count ? `Savat · ${t.count} ta · ${fmt(t.sum)}` : "", () => go("cart"));
  else if (view === "cart") setMain(t.count ? "Rasmiylashtirish" : "", () => go("checkout"));
  else if (view === "checkout" && (inTg || DEMO)) setMain(busy ? "Yuborilmoqda…" : quote ? `Buyurtma berish · ${fmt(quote.total)}` : "Buyurtma berish", submit);
  else setMain("", null);
}
function syncBack(){
  if (!inTg) return;
  (sheetId || view !== "catalog") ? tg.BackButton.show() : tg.BackButton.hide();
}
if (inTg) tg.BackButton.onClick(() => {
  if (sheetId) return closeSheet();
  if (view === "checkout") return go("cart");
  go("catalog");
});
function go(v){
  if (sheetId) closeSheet();
  if (view === "checkout" && map){ map.remove(); map = null; }
  view = v;
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("on", s.id === "v-" + v));
  document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("on", b.dataset.go === v));
  $("top").classList.toggle("hide", v !== "catalog");
  const nonav = v === "checkout" || v === "done";
  $("nav").classList.toggle("hide", nonav); document.body.classList.toggle("nonav", nonav);
  if (v === "catalog") renderCatalog();
  if (v === "cart") renderCart();
  if (v === "checkout"){ quote = null; quoteErr = ""; renderCheckout(); }
  if (v === "orders") renderOrders();
  window.scrollTo(0, 0);
  syncBack(); syncMain();
}

/* ============ events ============ */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a],[data-go],[data-cat],[data-back],[data-mode],[data-pay]");
  if (!el) return;
  const d = el.dataset;
  if (d.go){ go(d.go); return; }
  if (d.cat !== undefined){
    const id = +d.cat;
    if (!id) path = [];
    else { const lvl = +d.lvl; path = path.slice(0, lvl); path.push(id); }
    query = ""; $("q").value = ""; $("qx").classList.add("hide");
    haptic("soft"); renderChips(); renderCatalog(); return;
  }
  if (d.back){ path.pop(); renderChips(); renderCatalog(); return; }
  if (d.mode){
    co.mode = d.mode; saveCo(); haptic("soft");
    document.querySelectorAll("#seg button").forEach(b => b.classList.toggle("on", b === el));
    ["map","place","link"].forEach(m => { const x = $("m-"+m); if (x) x.classList.toggle("hide", m !== co.mode); });
    if (co.mode === "map") initMap();
    quote = null; requestQuote(); renderQuote(); return;
  }
  if (d.pay){
    if (el.disabled) return;
    co.pay = d.pay; saveCo(); haptic("soft");
    document.querySelectorAll("[data-pay]").forEach(b => b.classList.toggle("on", b === el)); return;
  }
  const a = d.a, id = d.id;
  if (a === "inc") changeQty(id, 1);
  else if (a === "dec") changeQty(id, -1);
  else if (a === "open") openSheet(id);
  else if (a === "close") closeSheet();
  else if (a === "geo") geolocate();
  else if (a === "contact"){
    tg.requestContact((ok, r) => {
      const ph = ok && r && r.responseUnsafe && r.responseUnsafe.contact && r.responseUnsafe.contact.phone_number;
      if (ph){ const v = (ph.startsWith("+") ? "" : "+") + ph; $("phone").value = v; co.phone = v; saveCo(); notifyH("success"); }
    });
  }
  else if (a === "copy"){
    const txt = $("cardn").textContent.replace(/\s/g, "");
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast("Karta raqami nusxalandi"), () => toast(txt));
  }
  else if (a === "tochat"){ try { tg.close(); } catch(e){} }
});
$("sbg").onclick = closeSheet;
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "q"){ query = t.value.trim(); $("qx").classList.toggle("hide", !query); renderCatalog(); return; }
  if (t.id === "addr"){ co.addr = t.value; saveCo(); }
  if (t.id === "note"){ co.note = t.value; saveCo(); }
  if (t.id === "phone"){ co.phone = t.value; saveCo(); }
  if (t.id === "lnk"){ co.link = t.value; saveCo(); requestQuote(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "grp"){ co.grp = t.value; co.place = ""; saveCo(); fillPlaces(); requestQuote(); }
  if (t.id === "plc"){ co.place = t.value; saveCo(); requestQuote(); }
});
$("qx").onclick = () => { $("q").value = ""; query = ""; $("qx").classList.add("hide"); renderCatalog(); };
$("q").addEventListener("keydown", e => { if (e.key === "Enter") e.target.blur(); });

/* ============ start ============ */
(async function init(){
  try {
    const data = await api("catalog");
    products = data.products; cats = data.categories;
  } catch(e){
    $("grid").innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="e">😕</div><p>Mahsulotlarni yuklab bo'lmadi</p><button class="btn ghost" onclick="location.reload()">Qayta urinish</button></div>`;
    return;
  }
  for (const id of Object.keys(cart)){ const p = byId(id); if (!p) delete cart[id]; else if (cart[id] > p.stock) cart[id] = p.stock; }
  saveCart();
  renderChips(); renderCatalog(); updateBadge(); syncMain();
  if (inTg || DEMO){
    try {
      me = await api("me");
      if (me.bonus){ $("bonusVal").textContent = fmt(me.bonus); $("bonusPill").classList.remove("hide"); }
    } catch(e){ /* katalog baribir ishlaydi */ }
  }
})();
</script>
</body>
